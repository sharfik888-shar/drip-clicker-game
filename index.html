<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DRIP FITS: GLOBAL 26</title>

<style>
:root{color-scheme:dark;--bg:#09090b;--card:rgba(30,30,40,0.85);--card-border:rgba(255,255,255,0.1);--fg:#f4f4f6;--mut:#8b8b99;--ac:#b6ff3c;--ac2:#ff3cac;--blur:blur(12px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;z-index:10}
header{padding:20px 16px 10px;text-align:center;position:relative;z-index:15;flex:none}
#bal{font-size:38px;font-weight:900;color:var(--ac);letter-spacing:.5px;text-shadow:0 0 15px rgba(182,255,60,.3)}
#sub{font-size:12px;color:var(--mut);margin-top:4px;font-weight:bold;}
#rank{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--card-border);backdrop-filter:var(--blur);font-size:13px;font-weight:700;color:var(--ac2)}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 14px 80px;position:relative;z-index:10}
main::-webkit-scrollbar{display:none}

nav{display:flex;gap:4px;padding:10px 8px;background:rgba(20,20,25,0.95);backdrop-filter:var(--blur);border-top:1px solid var(--card-border);justify-content:space-between;position:absolute;bottom:0;left:0;right:0;z-index:20;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;min-width:0;padding:8px 0;border:0;border-radius:14px;background:transparent;color:var(--mut);font-weight:700;font-size:9px;transition:.2s;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
nav button.on{background:var(--card);border:1px solid var(--card-border);color:var(--ac);box-shadow:0 0 15px rgba(182,255,60,0.1)}
nav svg{width:20px;height:20px;fill:currentColor;}

.card{background:var(--card);backdrop-filter:var(--blur);border:1px solid var(--card-border);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:.2s}
.ic{width:52px;height:52px;border-radius:14px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
.card .t{flex:1;min-width:0}.card b{display:block;font-size:15px;line-height:1.2;margin-bottom:4px;}.card small{color:var(--mut);font-size:12px}
.btn{padding:12px 16px;border:0;border-radius:14px;background:rgba(255,255,255,0.08);color:var(--fg);font-weight:700;font-size:14px;cursor:pointer;transition:.2s;border:1px solid rgba(255,255,255,0.05);white-space:nowrap;}
.btn.pri{background:var(--ac);color:#10130a;box-shadow:0 0 20px rgba(182,255,60,0.3);border:0}
.btn.pk{background:var(--ac2);color:#fff;box-shadow:0 0 20px rgba(255,60,172,0.3);border:0}
.btn:disabled{opacity:0.5;filter:grayscale(1);cursor:not-allowed;}

#tapw{display:flex;flex-direction:column;align-items:center;padding-top:10px}
#tap{width:200px;height:200px;border-radius:50%;border:4px solid rgba(255,255,255,0.1);background:radial-gradient(circle at 35% 30%,#d6ff7a,var(--ac) 55%,#6aa010);color:#10130a;box-shadow:0 0 60px rgba(182,255,60,.4);transition:transform .06s;position:relative;touch-action:manipulation;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#tap:active{transform:scale(.92)}
#tap svg{width:90px;height:90px;filter:drop-shadow(0 10px 10px rgba(0,0,0,0.3));}
.tap-val{font-size:24px;font-weight:900;margin-top:15px;color:var(--ac);text-align:center;}

.upgrades {width:100%;margin-top:20px;}
.up-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.up-card-info b{font-size:16px;display:block;margin-bottom:4px;}
.up-card-info small{color:var(--mut);font-size:12px;}

/* КРАСИВЫЙ СТЕНД */
.stand-container {
    position: relative;
    width: 100%;
    height: 420px;
    background: radial-gradient(circle at 50% 30%, #1a1a24 0%, #09090b 80%);
    border-radius: 24px;
    border: 1px solid var(--card-border);
    margin-bottom: 15px;
    display: flex;
    justify-content: center;
    align-items: flex-end; /* Ставим на "пол"
    overflow: hidden;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
}

/* Подсветка сзади */
.stand-spotlight {
    position: absolute;
    top: 10%;
    width: 150px;
    height: 150px;
    background: var(--ac);
    filter: blur(80px);
    opacity: 0.15;
    border-radius: 50%;
}

/* Подиум */
.stand-podium {
    position: absolute;
    bottom: 15px;
    width: 180px;
    height: 30px;
    background: linear-gradient(to bottom, #222, #111);
    border-radius: 50%;
    border-bottom: 2px solid #333;
    box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 15px rgba(182,255,60,0.1);
}

/* Базовый манекен (темный, матовый) */
.mannequin-base {
    position: absolute;
    bottom: 30px;
    width: 140px;
    height: 320px;
}

/* Вещи на манекене */
.eq-item {
    position: absolute;
    width: 100px;
    height: 100px;
    transition: all 0.3s ease;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6));
    pointer-events: none; /* Чтобы не мешали кликам */
}
.eq-item svg {
    width: 100%;
    height: 100%;
}

.slot-btn{background:var(--card);border:1px solid var(--card-border);padding:10px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;cursor:pointer;transition:0.2s;}
.slot-btn:active {transform: scale(0.98);}
.slot-btn b{font-size:14px;}
.slot-btn small{color:var(--mut);font-size:12px;margin-left:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}

/* МОДАЛКА ВЫБОРА */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);z-index:100;display:none;flex-direction:column;justify-content:flex-end;}
.modal.open{display:flex;}
.modal-content{background:var(--bg);border-top-left-radius:24px;border-top-right-radius:24px;max-height:75vh;overflow-y:auto;padding:20px;border-top:1px solid var(--card-border);animation: slideUp 0.3s ease;}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:2;}
.modal-header h3{margin:0;}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:0.2s;}
.cell:active{transform:scale(0.95);}
.cell.own{border-color:rgba(255,255,255,0.1);}
.cell .artw{width:60px;height:60px;}
.artw{display:block;width:100%;height:100%;}
.artw svg{width:100%;height:100%;display:block;}
</style>
</head>

                if(COL[k][1]===c[1])k=(k+5)%15;
                ITEMS.push({
                    id:'g'+n,g:1,t:t[0],c1:c[1],c2:COL[k][1],pt:(h%7<2)?0:1+(h>>>5)%6,bi,
                    fl:(h>>>9)&1,rt:((h>>>10)%13)-6,sc:.92+((h>>>14)%14)/100,r,
                    p:Math.round(t[3]*MU[r]*(B?B[2]:.8)*(.8+((h>>>8)%40)/100)/10)*10,
                    n:t[1]+(B?' '+B[0]:'')+' «'+s+'» '+c[0]+EN[t[2]]
                });
                n++;
            }
        }
    }
})();
const IM = {}; ITEMS.forEach(i => IM[i.id] = i);

// ВАЖНО: Добавлен параметр noBg для отрисовки вещей на стенде без фона
function artSpan(i, noBg = false) {
    const id='a'+i.id, fx=i.fl?-1:1, pt=(['chain','shades'].includes(i.t)||i.t[0]==='w')?0:i.pt;
    const D={ 1:"<pattern id='"+id+"p' width='12' height='12' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='12' height='12' fill='"+i.c1+"'/><rect width='5' height='12' fill='"+i.c2+"'/></pattern>", 2:"<pattern id='"+id+"p' width='14' height='14' patternUnits='userSpaceOnUse'><rect width='14' height='14' fill='"+i.c1+"'/><circle cx='7' cy='7' r='3' fill='"+i.c2+"'/></pattern>", 3:"<pattern id='"+id+"p' width='20' height='20' patternUnits='userSpaceOnUse'><rect width='20' height='20' fill='"+i.c1+"'/><rect width='10' height='10' fill='"+i.c2+"'/><rect x='10' y='10' width='10' height='10' fill='"+i.c2+"'/></pattern>", 4:"<pattern id='"+id+"p' width='32' height='32' patternUnits='userSpaceOnUse'><rect width='32' height='32' fill='"+i.c1+"'/><ellipse cx='8' cy='9' rx='9' ry='5' fill='"+i.c2+"' opacity='.75'/><ellipse cx='23' cy='22' rx='8' ry='6' fill='"+i.c2+"' opacity='.75'/></pattern>", 5:"<linearGradient id='"+id+"p' x1='0' x2='1' y1='0' y2='0'><stop offset='.5' stop-color='"+i.c1+"'/><stop offset='.5' stop-color='"+i.c2+"'/></linearGradient>", 6:"<linearGradient id='"+id+"p' x1='0' x2='0' y1='0' y2='1'><stop offset='0' stop-color='"+i.c1+"'/><stop offset='1' stop-color='"+i.c2+"'/></linearGradient>" };
    let art=ART[i.t].split(MAIN[i.t]).join(pt?"url(#"+id+"p)":i.c1);
    if(ACC[i.t])art=art.split(ACC[i.t]).join(i.c2);
    
    // Если noBg, мы не рисуем квадрат сзади
    const bg = noBg ? 'transparent' : ['#2a2a34','#16304a','#2e1f4a','#4a3410'][i.r];
    const rc = noBg ? '' : ['','','#b36bff','#ffb02e'][i.r];
    
    const bp=BP[i.t],bd=i.bi!==undefined&&bp?"<circle cx='"+bp[0]+"' cy='"+bp[1]+"' r='8' fill='#111' stroke='#fff' stroke-width='1.2'/><text transform='translate("+bp[0]+" "+(bp[1]+3)+") scale("+fx+" 1)' text-anchor='middle' font-size='"+(BR[i.bi][1].length>1?7:9)+"' font-weight='900' fill='#fff' font-family='Arial,sans-serif'>"+BR[i.bi][1]+"</text>":'';
    
    return `<span class='artw'><svg viewBox='0 0 100 100'><defs>${D[pt]||''}</defs>${noBg?'':`<rect width='100' height='100' fill='${bg}'/>`}<g transform='translate(50 50) rotate(${i.rt}) scale(${fx*i.sc} ${i.sc}) translate(-50 -50)'>${art}${bd}</g>${rc?`<rect x='1.5' y='1.5' width='97' height='97' rx='8' fill='none' stroke='${rc}' stroke-width='3'/>`:''}</svg></span>`;
}

let S = { r: 0, own: {}, eq: {}, tapLvl: 1, autoLvl: 0 };
try { const x = localStorage.getItem('drip6'); if(x) S = Object.assign(S, JSON.parse(x)); } catch(e) {}
const save = () => { try { localStorage.setItem('drip6', JSON.stringify(S)); } catch(e) {} };

const getStandValue = () => Object.values(S.eq).reduce((sum, id) => sum + (id && IM[id] ? IM[id].p : 0), 0);
const getStandBonus = () => 1 + (getStandValue() / 50000);

const getTapValue = () => Math.floor(10 * S.tapLvl * getStandBonus());
const getAutoValue = () => Math.floor(S.autoLvl * 15 * getStandBonus());
const getTapCost = () => Math.floor(100 * Math.pow(1.6, S.tapLvl - 1));
const getAutoCost = () => Math.floor(500 * Math.pow(1.7, S.autoLvl));

const SLOTS = { head: ['cap', 'mask', 'shades'], neck: ['chain'], top: ['hood', 'puff', 'jack', 'tee'], bot: ['cargo', 'jeans', 'boxers'], shoe: ['sneak', 'drill', 'socks'], wrist: ['watch'], back: ['bag', 'pack'], waist: ['belt'] };
const SLOT_NAMES = { head: 'Голова / Лицо', neck: 'Шея (Цепь)', top: 'Верх', bot: 'Низ', shoe: 'Обувь', wrist: 'Запястье (Часы)', back: 'Спина (Сумка)', waist: 'Пояс (Ремень)' };

// ИДЕАЛЬНЫЕ ПОЗИЦИИ (top, left, scale, z-index)
// Манекен имеет рост 320px и ширину 140px (находится в центре)
const EQ_POS = {
    head: { top: '8%', left: '50%', transform: 'translateX(-50%) scale(0.7)', z: 10 },
    neck: { top: '26%', left: '50%', transform: 'translateX(-50%) scale(0.5)', z: 9 },
    top: { top: '25%', left: '50%', transform: 'translateX(-50%) scale(1.1)', z: 5 },
    bot: { top: '52%', left: '50%', transform: 'translateX(-50%) scale(0.95)', z: 4 },
    shoe: { top: '85%', left: '50%', transform: 'translateX(-50%) scale(0.75)', z: 6 },
    wrist: { top: '50%', left: '20%', transform: 'translateX(-50%) scale(0.3) rotate(-15deg)', z: 11 }, // Левая рука
    back: { top: '30%', left: '25%', transform: 'translateX(-50%) scale(0.8)', z: 2 }, // За спиной
    waist: { top: '52%', left: '50%', transform: 'translateX(-50%) scale(0.55)', z: 7 }
};

function head(){
 $('bal').textContent = fmt(S.r) + ' ₽';
 $('sub').textContent = '+' + fmt(getAutoValue()) + ' ₽/сек (x' + getStandBonus().toFixed(2) + ')';
 $('rank').textContent = '🔥 Уличный дриппер';
}

let tab='tap';
let shopLimit = 20;
let invLimit = 20;

function view(){
 const scrollPos = $('main').scrollTop;
 const m=$('main'); let h='';
 
 if(tab==='tap'){
  h=`<div id="tapw">
      <div id="tap">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M30 35 C30 15, 70 15, 70 35" stroke="#000" stroke-width="6" stroke-linecap="round"/>
          <path d="M20 45 L80 45 L90 90 C90 95, 85 100, 80 100 L20 100 C15 100, 10 95, 10 90 L20 45Z" fill="#10130a"/>
          <text x="50" y="82" font-size="40" font-weight="900" fill="#b6ff3c" text-anchor="middle">$</text>
        </svg>
      </div>
      <div class="tap-val">+${fmt(getTapValue())} ₽ за тап</div>
      
      <div class="upgrades">
         <div class="up-card">
             <div class="up-card-info"><b>👆 Сила Тапа</b><small>Увеличивает доход за клик</small></div>
             <button class="btn pri" onclick="buyUpgrade('tap')" ${S.r < getTapCost() ? 'disabled' : ''}>Ур. ${S.tapLvl} | ${fmt(getTapCost())} ₽</button>
         </div>
         <div class="up-card">
             <div class="up-card-info"><b>🤖 Автокликер</b><small>Дает пассивный доход</small></div>
             <button class="btn pk" onclick="buyUpgrade('auto')" ${S.r < getAutoCost() ? 'disabled' : ''}>Ур. ${S.autoLvl} | ${fmt(getAutoCost())} ₽</button>
         </div>
      </div>
     </div>`;
 } else if(tab==='shop'){
  h='<h3 style="margin-top:0">Дрип Шоп</h3>';
  h+=ITEMS.slice(0, shopLimit).map(i=>{
      const o=S.own[i.id];
      return `<div class="card">
          <div class="ic">${artSpan(i)}</div>
          <div class="t"><b>${i.n}</b><small style="color:var(--ac2)">${['Обычная','Редкая','Эпик','Легенда'][i.r]}</small><br><small>${fmt(i.p)} ₽</small></div>
          <button class="btn ${o?'':'pri'}" onclick="buy('${i.id}')" ${o?'disabled':''}>${o?'Есть':'Купить'}</button>
      </div>`;
  }).join('');
  if(shopLimit < ITEMS.length) h += `<button class="btn" onclick="shopLimit += 20; view();" style="width:100%; margin-top:10px;">Показать еще (${shopLimit} из ${ITEMS.length})</button>`;
 } else if(tab==='inv'){
  h='<h3 style="margin-top:0">Твой Инвентарь</h3>';
  const owned=ITEMS.filter(i=>S.own[i.id]);
  if(!owned.length) h+='<p style="text-align:center;color:var(--mut);margin-top:20px;">Пока пусто. Купи шмот в магазине!</p>';
  else {
      h+='<div class="grid">';
      h+=owned.slice(0, invLimit).map(i=>`<div class="cell own">${artSpan(i)}<div style="margin-top:5px;line-height:1.1">${i.n}</div></div>`).join('');
      h+='</div>';
      if(invLimit < owned.length) h += `<button class="btn" onclick="invLimit += 20; view();" style="width:100%; margin-top:10px;">Показать еще (${invLimit} из ${owned.length})</button>`;
  }
 } else if(tab==='stand'){
  h=`<h3 style="margin-top:0">Примерочная</h3>`;
  
  // КРАСИВЫЙ СТЕНД
  h+=`<div class="stand-container">
      <div class="stand-spotlight"></div>
      <div class="stand-podium"></div>
      
      <!-- Темный манекен с анатомией -->
      <svg class="mannequin-base" viewBox="0 0 100 200" preserveAspectRatio="xMidYMax meet">
          <defs>
              <linearGradient id="mannequin-grad" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#2a2a2a"/>
                  <stop offset="50%" stop-color="#3a3a3a"/>
                  <stop offset="100%" stop-color="#1a1a1a"/>
              </linearGradient>
          </defs>
          <!-- Голова -->
          <ellipse cx="50" cy="20" rx="14" ry="16" fill="url(#mannequin-grad)"/>
          <!-- Шея -->
          <rect x="45" y="35" width="10" height="10" fill="url(#mannequin-grad)"/>
          <!-- Торс -->
          <path d="M30 45 Q50 40 70 45 L75 105 L25 105 Z" fill="url(#mannequin-grad)"/>
          <!-- Руки -->
          <path d="M30 45 Q15 60 15 95 L25 95 Q25 65 35 50 Z" fill="url(#mannequin-grad)"/>
          <path d="M70 45 Q85 60 85 95 L75 95 Q75 65 65 50 Z" fill="url(#mannequin-grad)"/>
          <!-- Ноги -->
          <path d="M30 105 L40 180 L50 180 L50 120 Z" fill="url(#mannequin-grad)"/>
          <path d="M70 105 L60 180 L50 180 L50 120 Z" fill="url(#mannequin-grad)"/>
      </svg>`;
      
  // Отрисовка надетых вещей строго по слоям (Z-index)
  const eqArray = Object.keys(SLOTS).map(slot => ({ slot, item: IM[S.eq[slot]], pos: EQ_POS[slot] }))
                                     .filter(x => x.item)
                                     .sort((a, b) => a.pos.z - b.pos.z); // Сортируем по слоям
      
  eqArray.forEach(x => {
      h+=`<div class="eq-item" style="top:${x.pos.top};left:${x.pos.left};transform:${x.pos.transform}; z-index:${x.pos.z};">
            ${artSpan(x.item, true)} <!-- true = без фона -->
          </div>`;
  });
  
  h+=`</div>`;
  
  h+=`<div class="card" style="background:rgba(182,255,60,0.1);border-color:var(--ac);">
      <div class="t"><b>Флекс Стенда</b><small>Стоимость: ${fmt(getStandValue())} ₽</small></div>
      <b style="color:var(--ac);font-size:20px;">x${getStandBonus().toFixed(2)}</b>
  </div>`;
  
  h+=`<div class="grid" style="grid-template-columns: 1fr 1fr;">`;
  for(let slot in SLOTS) {
      const eqId = S.eq[slot];
      const item = eqId ? IM[eqId] : null;
      h+=`<div class="slot-btn" onclick="openSelect('${slot}')" style="flex-direction:column; text-align:center; padding:15px 10px; gap:8px;">
             <div class="ic" style="width:50px;height:50px;">${item ? artSpan(item) : '＋'}</div>
             <div>
                 <b style="font-size:12px;">${SLOT_NAMES[slot]}</b>
                 <small style="margin:0; max-width:100px;">${item ? item.n : 'Пусто'}</small>
             </div>
      </div>`;
  }
  h+=`</div>`;
  
 } else if(tab==='top'){
  const invValue = Object.keys(S.own).reduce((sum, id) => sum + (IM[id] ? IM[id].p : 0), 0);
  h=`<h3 style="margin-top:0">Топ Дрипперов</h3>
     <p style="color:var(--mut);font-size:12px;margin-bottom:15px;">Рейтинг по общему флексу</p>
     
     <div class="card"><div class="ic">🥇</div><div class="t"><b>@mega_drip</b><small>Стенд: 999,999 ₽</small></div><b style="color:var(--ac)">5M ₽</b></div>
     <div class="card"><div class="ic">🥈</div><div class="t"><b>@trap_star</b><small>Стенд: 850,000 ₽</small></div><b style="color:var(--ac)">3M ₽</b></div>
     <div class="card"><div class="ic">🥉</div><div class="t"><b>@young_thug</b><small>Стенд: 500,000 ₽</small></div><b style="color:var(--ac)">1.5M ₽</b></div>
     
     <h4 style="margin:20px 0 10px;color:var(--mut);">Твоя статистика</h4>
     <div class="card"><div class="t"><b>Баланс</b></div><b style="color:var(--ac)">${fmt(S.r)} ₽</b></div>
     <div class="card"><div class="t"><b>Цена всех вещей</b><small>Общая стоимость инвентаря</small></div><b style="color:var(--ac)">${fmt(invValue)} ₽</b></div>
     <div class="card"><div class="t"><b>Цена вещей на стенде</b><small>Бонус к доходу</small></div><b style="color:var(--ac2)">${fmt(getStandValue())} ₽</b></div>`;
 }
 m.innerHTML=h;
 $('main').scrollTop = scrollPos; 
 
 if(tab==='tap'){
    $('tap').addEventListener('pointerdown',()=>{
        S.r += getTapValue(); save(); head();
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });
 }
}

function buyUpgrade(type){
    if(type === 'tap'){
        const cost = getTapCost();
        if(S.r >= cost) { S.r -= cost; S.tapLvl++; save(); head(); view(); }
        else alert('Мало кэша!');
    } else if(type === 'auto'){
        const cost = getAutoCost();
        if(S.r >= cost) { S.r -= cost; S.autoLvl++; save(); head(); view(); }
        else alert('Мало кэша!');
    }
}

function buy(id){
    const item = ITEMS.find(x=>x.id===id);
    if(S.r >= item.p){
        S.r -= item.p; S.own[id] = 1; save(); head(); view();
        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else alert('Мало кэша!');
}

let currentSlot = null;
function openSelect(slot) {
    currentSlot = slot;
    const types = SLOTS[slot];
    const available = ITEMS.filter(i => S.own[i.id] && types.includes(i.t));
    
    $('modal-title').textContent = SLOT_NAMES[slot];
    const list = $('modal-list');
    
    if(available.length === 0) {
        list.innerHTML = '<p style="text-align:center;color:var(--mut);grid-column:1/-1;">Нет вещей для этого слота</p>';
    } else {
        list.innerHTML = available.map(i => `<div class="cell own" onclick="equipItem('${i.id}')">${artSpan(i)}<div style="margin-top:5px;line-height:1.1">${i.n}</div></div>`).join('');
    }
    $('select-modal').classList.add('open');
}

function equipItem(id) {
    if(currentSlot) {
        S.eq[currentSlot] = id;
        save(); head(); view(); closeModal();
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }
}

function closeModal() {
    $('select-modal').classList.remove('open');
    currentSlot = null;
}

$('nav').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    tab=b.dataset.t;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
    view();
});

setInterval(() => {
    if (S.autoLvl > 0) {
        S.r += getAutoValue();
        head();
    }
}, 1000);
setInterval(save, 5000);

head(); view();
</script>
</body>
</html>
