<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DRIP FITS: GLOBAL 26</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:rgba(30,30,40,0.85);--card-border:rgba(255,255,255,0.1);--fg:#f4f4f6;--mut:#8b8b99;--ac:#b6ff3c;--ac2:#ff3cac;--blur:blur(12px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;z-index:10}
header{padding:20px 16px 10px;text-align:center;position:relative;z-index:15;flex:none}
#bal{font-size:38px;font-weight:900;color:var(--ac);letter-spacing:.5px;text-shadow:0 0 15px rgba(182,255,60,.3)}
#sub{font-size:12px;color:var(--mut);margin-top:4px}
#rank{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--card-border);backdrop-filter:var(--blur);font-size:13px;font-weight:700;color:var(--ac2)}

/* ИСПРАВЛЕННЫЙ СКРОЛЛ */
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 14px 80px;position:relative;z-index:10}
main::-webkit-scrollbar{display:none}

nav{display:flex;gap:4px;padding:10px 8px;background:rgba(20,20,25,0.95);backdrop-filter:var(--blur);border-top:1px solid var(--card-border);justify-content:space-between;position:absolute;bottom:0;left:0;right:0;z-index:20;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;min-width:0;padding:10px 0;border:0;border-radius:14px;background:transparent;color:var(--mut);font-weight:700;font-size:10px;transition:.2s;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
nav button.on{background:var(--card);border:1px solid var(--card-border);color:var(--ac);box-shadow:0 0 15px rgba(182,255,60,0.1)}
nav svg{width:20px;height:20px;fill:currentColor;}

.card{background:var(--card);backdrop-filter:var(--blur);border:1px solid var(--card-border);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:.2s}
.ic{width:52px;height:52px;border-radius:14px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
.card .t{flex:1;min-width:0}.card b{display:block;font-size:15px}.card small{color:var(--mut);font-size:12px}
.btn{padding:12px 16px;border:0;border-radius:14px;background:rgba(255,255,255,0.08);color:var(--fg);font-weight:700;font-size:14px;cursor:pointer;transition:.2s;border:1px solid rgba(255,255,255,0.05);white-space:nowrap;}
.btn.pri{background:var(--ac);color:#10130a;box-shadow:0 0 20px rgba(182,255,60,0.3);border:0}
.btn.pk{background:var(--ac2);color:#fff;box-shadow:0 0 20px rgba(255,60,172,0.3);border:0}

#tapw{display:flex;flex-direction:column;align-items:center;padding-top:20px}
#tap{width:220px;height:220px;border-radius:50%;border:4px solid rgba(255,255,255,0.1);background:radial-gradient(circle at 35% 30%,#d6ff7a,var(--ac) 55%,#6aa010);color:#10130a;font-size:80px;font-weight:900;box-shadow:0 0 60px rgba(182,255,60,.4);transition:transform .06s;position:relative;touch-action:manipulation;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#tap:active{transform:scale(.92)}
#tap svg{width:100px;height:100px;filter:drop-shadow(0 10px 10px rgba(0,0,0,0.3));}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;}
.cell.own{border-color:var(--ac);}
.cell .artw{width:60px;height:60px;}
.artw{display:block;width:100%;height:100%;}
.artw svg{width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="app">
 <header>
  <div id="bal">0 ₽</div>
  <div id="sub"></div>
  <div id="rank"></div>
 </header>
 <main id="main"></main>
 <nav id="nav">
  <button data-t="tap" class="on">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>Тап
  </button>
  <button data-t="shop">
    <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>Шоп
  </button>
  <button data-t="inv">
    <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 16H4V8h16v12z"/></svg>Вещи
  </button>
  <button data-t="cases">
    <svg viewBox="0 0 24 24"><path d="M21 8h-2V6c0-1.1-.9-2-2-2H7c-1.1 0-2 .9-2 2v2H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-4-2v2H7V6h10zm4 14H3V10h18v10zM9 14h6v2H9z"/></svg>Кейсы
  </button>
  <button data-t="top">
    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Топ
  </button>
  <button data-t="settings">
    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>Настр.
  </button>
 </nav>
</div>

<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString('ru-RU').replace(/\u00a0/g,' ');

// ДВИЖОК ГЕНЕРАЦИИ ВЕЩЕЙ (ИЗ ТВОЕГО КОДА)
const ART={
cap:"<path d='M20 58 Q22 28 50 28 Q78 28 80 58Z' fill='#3a7bd5'/><path d='M62 56 Q92 54 92 66 L60 66Z' fill='#2a5aa0'/><rect x='20' y='56' width='62' height='5' fill='#1f3f73'/><circle cx='50' cy='28' r='3' fill='#fff'/>",
cargo:"<path d='M30 15H70L76 85H55L50 40L45 85H24Z' fill='#6b705c'/><rect x='30' y='15' width='40' height='7' fill='#4d513f'/><rect x='28' y='50' width='14' height='14' fill='#555a47'/><rect x='58' y='50' width='14' height='14' fill='#555a47'/>",
hood:"<path d='M34 20Q50 8 66 20L90 40L80 52L72 46V86H28V46L20 52L10 40Z' fill='#5a5a64'/><path d='M38 20Q50 34 62 20Q50 12 38 20Z' fill='#222'/><rect x='36' y='62' width='28' height='16' fill='#46464e'/><path d='M45 32V50M55 32V50' stroke='#ddd' stroke-width='2'/>",
bag:"<path d='M18 40Q50 0 82 40' stroke='#444' stroke-width='5' fill='none'/><rect x='22' y='38' width='56' height='42' rx='6' fill='#222'/><path d='M22 50H78L50 62Z' fill='#333'/><rect x='46' y='58' width='8' height='8' rx='2' fill='#b6ff3c'/>",
sneak:"<path d='M12 62V45Q30 44 38 34L50 44Q70 46 90 60V72H12Z' fill='#eee'/><rect x='12' y='68' width='78' height='9' rx='3' fill='#b6ff3c'/><path d='M38 34L50 44M44 40L52 36M50 44L58 40' stroke='#999' stroke-width='2' fill='none'/><path d='M12 62Q40 58 90 62' stroke='#ff3cac' stroke-width='3' fill='none'/>",
chain:"<path d='M22 20Q50 90 78 20' stroke='#ffd34d' stroke-width='6' stroke-dasharray='9 3' fill='none' stroke-linecap='round'/><rect x='40' y='52' width='20' height='20' rx='4' fill='#ffd34d' transform='rotate(45 50 62)'/><circle cx='50' cy='62' r='4' fill='#fff'/>",
shades:"<rect x='12' y='38' width='34' height='22' rx='8' fill='#111'/><rect x='54' y='38' width='34' height='22' rx='8' fill='#111'/><rect x='44' y='42' width='12' height='5' fill='#111'/><path d='M18 42L30 56M60 42L72 56' stroke='#666' stroke-width='3'/><path d='M12 42L4 38M88 42L96 38' stroke='#111' stroke-width='4'/>",
mask:"<path d='M50 12Q80 12 80 48Q80 80 66 90H34Q20 80 20 48Q20 12 50 12Z' fill='#202024'/><rect x='28' y='36' width='44' height='14' rx='7' fill='#e8c9a0'/><circle cx='40' cy='43' r='3' fill='#111'/><circle cx='60' cy='43' r='3' fill='#111'/>",
puff:"<path d='M34 16H66L90 40L84 72H72V86H28V72H16L10 40Z' fill='#6fc3f5'/><path d='M28 36H72M28 50H72M28 64H72' stroke='#3a8cc0' stroke-width='3'/><path d='M50 16V86' stroke='#2a6c98' stroke-width='3'/>",
pack:"<rect x='25' y='14' width='50' height='72' rx='16' fill='#c0392b'/><rect x='33' y='48' width='34' height='26' rx='6' fill='#962d22'/><path d='M33 32H67' stroke='#fff' stroke-width='3'/><rect x='45' y='56' width='10' height='5' fill='#ffd34d'/><path d='M38 14Q50 2 62 14' stroke='#962d22' stroke-width='5' fill='none'/>",
jack:"<path d='M34 16H66L90 40L84 76H72V88H28V76H16L10 40Z' fill='#2b2118'/><path d='M34 16L50 44L66 16Z' fill='#4a3a2b'/><path d='M50 44V88' stroke='#8a6a4a' stroke-width='2'/><rect x='60' y='56' width='10' height='3' fill='#aaa'/>",
grillz:"<rect x='14' y='38' width='72' height='26' rx='12' fill='#a8322a'/><g fill='#ffd34d' stroke='#b8860b'><rect x='22' y='42' width='9' height='14' rx='3'/><rect x='31' y='42' width='9' height='14' rx='3'/><rect x='40' y='42' width='9' height='14' rx='3'/><rect x='49' y='42' width='9' height='14' rx='3'/><rect x='58' y='42' width='9' height='14' rx='3'/><rect x='67' y='42' width='9' height='14' rx='3'/></g><path d='M80 18L82 26L90 28L82 30L80 38L78 30L70 28L78 26Z' fill='#fff'/>",
drill:"<path d='M12 62V45Q30 44 38 34L50 44Q70 46 90 60V72H12Z' fill='#16161a'/><rect x='12' y='68' width='78' height='9' rx='3' fill='#ff4a1c'/><path d='M60 52Q66 38 70 30Q72 42 80 48Q76 58 66 58Z' fill='#ff9a1c'/><path d='M12 62Q40 58 90 62' stroke='#ff4a1c' stroke-width='3' fill='none'/>",
tee:"<path d='M30 20 L50 20 L70 20 L90 40 L80 50 L75 45 V85 H25 V45 L20 50 L10 40 Z' fill='#e8e8ee'/>",
jeans:"<path d='M30 15H70L76 85H55L50 40L45 85H24Z' fill='#3d5a8a'/><rect x='30' y='15' width='40' height='7' fill='#2a4266'/>"
};
const MAIN={cap:'#3a7bd5',cargo:'#6b705c',hood:'#5a5a64',bag:'#222',sneak:'#eee',chain:'#ffd34d',shades:'#111',mask:'#202024',puff:'#6fc3f5',pack:'#c0392b',jack:'#2b2118',tee:'#e8e8ee',jeans:'#3d5a8a'};
const ACC={sneak:'#b6ff3c',bag:'#b6ff3c',pack:'#ffd34d',jeans:'#ffd34d'};
const BR=[['Dior','D'],['Balenciaga','B'],['Gucci','G'],['Louis Vuitton','LV'],['Prada','P'],['Nike','N'],['Supreme','S']];
const BP={cap:[50,44],cargo:[38,34],hood:[50,52],bag:[50,50],sneak:[64,56],mask:[50,70],puff:[38,32],pack:[50,40],jack:[38,36],tee:[50,46],jeans:[60,32]};

function artSpan(i) {
    const id='a'+i.id, fx=i.fl?-1:1;
    const pt = i.pt || 0;
    const D={
        1:"<pattern id='"+id+"p' width='12' height='12' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='12' height='12' fill='"+i.c1+"'/><rect width='5' height='12' fill='"+i.c2+"'/></pattern>",
        2:"<pattern id='"+id+"p' width='14' height='14' patternUnits='userSpaceOnUse'><rect width='14' height='14' fill='"+i.c1+"'/><circle cx='7' cy='7' r='3' fill='"+i.c2+"'/></pattern>",
        3:"<pattern id='"+id+"p' width='20' height='20' patternUnits='userSpaceOnUse'><rect width='20' height='20' fill='"+i.c1+"'/><rect width='10' height='10' fill='"+i.c2+"'/><rect x='10' y='10' width='10' height='10' fill='"+i.c2+"'/></pattern>",
        4:"<pattern id='"+id+"p' width='32' height='32' patternUnits='userSpaceOnUse'><rect width='32' height='32' fill='"+i.c1+"'/><ellipse cx='8' cy='9' rx='9' ry='5' fill='"+i.c2+"' opacity='.75'/><ellipse cx='23' cy='22' rx='8' ry='6' fill='"+i.c2+"' opacity='.75'/></pattern>",
        5:"<linearGradient id='"+id+"p' x1='0' x2='1' y1='0' y2='0'><stop offset='.5' stop-color='"+i.c1+"'/><stop offset='.5' stop-color='"+i.c2+"'/></linearGradient>",
        6:"<linearGradient id='"+id+"p' x1='0' x2='0' y1='0' y2='1'><stop offset='0' stop-color='"+i.c1+"'/><stop offset='1' stop-color='"+i.c2+"'/></linearGradient>"
    };
    let art=ART[i.t].split(MAIN[i.t]).join(pt?"url(#"+id+"p)":i.c1);
    if(ACC[i.t]) art=art.split(ACC[i.t]).join(i.c2||i.c1);
    
    const bg=['#2a2a34','#16304a','#2e1f4a','#4a3410'][i.r||0];
    const rc=['','','#b36bff','#ffb02e'][i.r||0];
    const bp=BP[i.t];
    const bd = i.bi !== undefined && bp ? "<circle cx='"+bp[0]+"' cy='"+bp[1]+"' r='9' fill='#111' stroke='#fff' stroke-width='1.5'/><text transform='translate("+bp[0]+" "+(bp[1]+3)+") scale("+fx+" 1)' text-anchor='middle' font-size='"+(BR[i.bi][1].length>1?7:10)+"' font-weight='900' fill='#fff' font-family='Arial,sans-serif'>"+BR[i.bi][1]+"</text>" : '';
    
    return "<span class='artw'><svg viewBox='0 0 100 100'><defs>"+(D[pt]||'')+"</defs><rect width='100' height='100' fill='"+bg+"'/><g transform='translate(50 50) rotate("+(i.rt||0)+") scale("+(fx*(i.sc||1))+" "+(i.sc||1)+") translate(-50 -50)'>"+art+bd+"</g>"+(rc?"<rect x='1.5' y='1.5' width='97' height='97' rx='8' fill='none' stroke='"+rc+"' stroke-width='3'/>":'')+"</svg></span>";
}

// НАШ СПИСОК ВЕЩЕЙ С БРЕНДАМИ
let ITEMS = [
    {id:'b1', n:'Худи Balenciaga', t:'hood', c1:'#111', c2:'#fff', p:5000, r:1, pt:1, bi:1, sc:1},
    {id:'g1', n:'Джинсы Gucci', t:'jeans', c1:'#3d5a8a', c2:'#ffd34d', p:4000, r:1, pt:0, bi:2, sc:1.1},
    {id:'lv1', n:'Сумка LV', t:'bag', c1:'#2b2118', c2:'#b8860b', p:8000, r:2, pt:3, bi:3, sc:1},
    {id:'n1', n:'Кроссы Nike', t:'sneak', c1:'#eee', c2:'#ff3cac', p:1500, r:0, pt:0, bi:5, sc:1.2},
    {id:'p1', n:'Пуховик Prada', t:'puff', c1:'#111', c2:'#111', p:15000, r:2, pt:0, bi:4, sc:1},
    {id:'s1', n:'Очки Supreme', t:'shades', c1:'#111', c2:'#ff0000', p:2000, r:0, pt:0, bi:6, sc:1.3},
    {id:'m1', n:'Балаклава Dior', t:'mask', c1:'#202024', c2:'#fff', p:6000, r:1, pt:0, bi:0, sc:1},
    {id:'c1', n:'Цепь Drill', t:'chain', c1:'#ffd34d', c2:'#fff', p:12000, r:3, pt:0, bi:undefined, sc:1},
    {id:'t1', n:'Футболка Off-White', t:'tee', c1:'#e8e8ee', c2:'#111', p:3000, r:0, pt:5, bi:undefined, sc:1}
];

let S={r:0,own:{}};
try{const x=localStorage.getItem('drip2');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('drip2',JSON.stringify(S))}catch(e){}};

function head(){
 $('bal').textContent=fmt(S.r)+' ₽';
 $('sub').textContent='Коллекция: '+Object.keys(S.own).length+' вещей';
 $('rank').textContent='🔥 Уличный дриппер';
}

let tab='tap';
function view(){
 const m=$('main'); let h='';
 if(tab==='tap'){
  h=`<div id="tapw">
      <div id="tap">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M30 35 C30 15, 70 15, 70 35" stroke="#000" stroke-width="6" stroke-linecap="round"/>
          <path d="M20 45 L80 45 L90 90 C90 95, 85 100, 80 100 L20 100 C15 100, 10 95, 10 90 L20 45Z" fill="#10130a"/>
          <text x="50" y="82" font-size="40" font-weight="900" fill="#b6ff3c" text-anchor="middle">$</text>
        </svg>
      </div>
      <div style="margin-top:20px; color:var(--mut); text-align:center; font-size:14px;">Тапай, чтобы заработать кэш</div>
     </div>`;
 } else if(tab==='shop'){
  h='<h3 style="margin-top:0">Дрип Шоп</h3>';
  h+=ITEMS.map(i=>{
      const o=S.own[i.id];
      return `<div class="card">
          <div class="ic">${artSpan(i)}</div>
          <div class="t"><b>${i.n}</b><small style="color:var(--ac2)">${['Обычная','Редкая','Эпик','Легенда'][i.r]}</small><br><small>${fmt(i.p)} ₽</small></div>
          <button class="btn ${o?'':'pri'}" onclick="buy('${i.id}')" ${o?'disabled':''}>${o?'Куплено':'Купить'}</button>
      </div>`;
  }).join('');
 } else if(tab==='inv'){
  h='<h3 style="margin-top:0">Твой Сет</h3>';
  const owned=ITEMS.filter(i=>S.own[i.id]);
  if(!owned.length) h+='<p style="text-align:center;color:var(--mut);margin-top:20px;">Пока пусто. Купи шмот в магазине!</p>';
  else {
      h+='<div class="grid">';
      h+=owned.map(i=>`<div class="cell own">${artSpan(i)}<div style="margin-top:5px;">${i.n}</div></div>`).join('');
      h+='</div>';
  }
 } else if(tab==='cases'){
  h=`<h3 style="margin-top:0">Кейсы</h3>
     <div class="card" style="flex-direction:column;text-align:center;padding:30px;">
        <div style="font-size:50px;margin-bottom:10px;">🎁</div>
        <b>Дрип-Кейс</b>
        <small style="margin-bottom:15px;">Шанс выбить вещь Supreme</small>
        <button class="btn pk" onclick="alert('Скоро будет!')">Открыть за 5000 ₽</button>
     </div>`;
 } else if(tab==='top'){
  h=`<h3 style="margin-top:0">Топ Дрипперов</h3>
     <div class="card"><div class="ic">🥇</div><div class="t"><b>@mega_drip</b><small>Ур. 99</small></div><b style="color:var(--ac)">999,999 ₽</b></div>
     <div class="card"><div class="ic">🥈</div><div class="t"><b>@trap_star</b><small>Ур. 85</small></div><b style="color:var(--ac)">850,000 ₽</b></div>
     <div class="card"><div class="ic">🥉</div><div class="t"><b>@young_thug</b><small>Ур. 72</small></div><b style="color:var(--ac)">500,000 ₽</b></div>`;
 } else if(tab==='settings'){
  h=`<h3 style="margin-top:0">Настройки</h3>
     <div class="card">
       <div class="t"><b>Промокод</b></div>
       <input type="text" id="pc" placeholder="DRIP26" style="padding:10px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;width:100px;outline:none;text-transform:uppercase;">
       <button class="btn pri" onclick="promo()">ОК</button>
     </div>
     <div class="card">
       <div class="t"><b>Музыка</b><small>В разработке</small></div>
       <button class="btn">ВКЛ</button>
     </div>`;
 }
 m.innerHTML=h;
 if(tab==='tap'){
    $('tap').addEventListener('pointerdown',()=>{
        S.r += 10; save(); head();
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });
 }
}

function buy(id){
    const item = ITEMS.find(x=>x.id===id);
    if(S.r >= item.p){
        S.r -= item.p;
        S.own[id] = 1;
        save(); head(); view();
        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else {
        alert('Мало кэша!');
    }
}

function promo(){
    const v = $('pc').value.toUpperCase();
    if(v === 'DRIP26') {
        S.r += 100000;
        save(); head();
        alert('+100 000 ₽!');
    } else {
        alert('Неверный промокод');
    }
}

// НАВИГАЦИЯ
$('nav').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    tab=b.dataset.t;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
    view();
});

head(); view();
</script>
