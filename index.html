<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drip Clicker</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --accent: #bb86fc;
            --card-bg: #1e1e1e;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .balance {
            font-size: 36px;
            font-weight: 900;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }
        .click-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .clicker-btn {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #333 0%, #111 100%);
            border: 3px solid var(--accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 0 20px rgba(187, 134, 252, 0.3);
        }
        .clicker-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 30px rgba(187, 134, 252, 0.6);
        }
        /* Магазин */
        .shop {
            width: 100%;
            background-color: var(--card-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            height: 40vh;
            overflow-y: auto;
        }
        .shop h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .item-icon {
            font-size: 24px;
        }
        .item-name {
            font-weight: bold;
            font-size: 16px;
        }
        .buy-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .buy-btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Шапка с балансом -->
    <div class="header">
        <div>Твой кэш:</div>
        <div class="balance"><span id="balance">0</span> $</div>
    </div>

    <!-- Зона кликера -->
    <div class="click-area">
        <div class="clicker-btn" id="clicker">💰</div>
    </div>

    <!-- Магазин -->
    <div class="shop">
        <h2>Дрип Шоп</h2>
        
        <div class="item">
            <div class="item-info">
                <span class="item-icon">🧢</span>
                <span class="item-name">Бандана Balencia</span>
            </div>
            <button class="buy-btn" onclick="buyItem('bandana', 100)">100 $</button>
        </div>

        <div class="item">
            <div class="item-info">
                <span class="item-icon">👕</span>
                <span class="item-name">Худи Guccii</span>
            </div>
            <button class="buy-btn" onclick="buyItem('hoodie', 500)">500 $</button>
        </div>

        <div class="item">
            <div class="item-info">
                <span class="item-icon">👖</span>
                <span class="item-name">Джинсы LV Luxury</span>
            </div>
            <button class="buy-btn" onclick="buyItem('jeans', 1500)">1500 $</button>
        </div>
        
        <div class="item">
            <div class="item-info">
                <span class="item-icon">👟</span>
                <span class="item-name">Кроссовки Drip</span>
            </div>
            <button class="buy-btn" onclick="buyItem('shoes', 5000)">5000 $</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем игру на весь экран
        tg.ready();

        // Переменные игры
        let balance = parseInt(localStorage.getItem('balance')) || 0;
        let inventory = JSON.parse(localStorage.getItem('inventory')) || [];

        const balanceElement = document.getElementById('balance');
        const clicker = document.getElementById('clicker');

        // Обновление интерфейса
        function updateUI() {
            balanceElement.innerText = balance;
            localStorage.setItem('balance', balance);
            localStorage.setItem('inventory', JSON.stringify(inventory));
        }

        // Клик по кнопке
        clicker.addEventListener('click', () => {
            balance += 1;
            updateUI();
            
            // Вибрация в телеге
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Покупка вещей
        function buyItem(itemId, price) {
            if (balance >= price) {
                if (inventory.includes(itemId)) {
                    alert('У тебя уже есть эта вещь!');
                    return;
                }
                balance -= price;
                inventory.push(itemId);
                updateUI();
                alert('Куплено! Вещь добавлена в инвентарь.');
                
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } else {
                alert('Не хватает кэша! Тапай больше.');
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }
        }

        // Старт
        updateUI();
    </script>
</body>
</html>
