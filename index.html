<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DRIP SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:rgba(30,30,40,0.85);--card-border:rgba(255,255,255,0.1);--fg:#f4f4f6;--mut:#8b8b99;--ac:#b6ff3c;--ac2:#ff3cac;--blur:blur(12px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;z-index:10;display:none;}
header{padding:20px 16px 10px;text-align:center;position:relative;z-index:15;flex:none}
#bal{font-size:38px;font-weight:900;color:var(--ac);letter-spacing:.5px;text-shadow:0 0 15px rgba(182,255,60,.3);transition:transform .15s}
#bal.bump{transform:scale(1.08)}
#sub{font-size:12px;color:var(--mut);margin-top:4px;font-weight:bold;}
#rank{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--card-border);backdrop-filter:var(--blur);font-size:13px;font-weight:700;color:var(--ac2)}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 14px 80px;position:relative;z-index:10}
main::-webkit-scrollbar{display:none}
nav{display:flex;gap:2px;padding:10px 4px;background:rgba(20,20,25,0.95);backdrop-filter:var(--blur);border-top:1px solid var(--card-border);justify-content:space-between;position:absolute;bottom:0;left:0;right:0;z-index:20;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;min-width:0;padding:6px 0;border:0;border-radius:10px;background:transparent;color:var(--mut);font-weight:700;font-size:8px;transition:.2s;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button.on{background:var(--card);border:1px solid var(--card-border);color:var(--ac);box-shadow:0 0 15px rgba(182,255,60,0.1)}
nav svg{width:16px;height:16px;fill:currentColor;}
.card{background:var(--card);backdrop-filter:var(--blur);border:1px solid var(--card-border);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:.2s}
.ic{width:52px;height:52px;border-radius:14px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
.card .t{flex:1;min-width:0}.card b{display:block;font-size:15px;line-height:1.2;margin-bottom:4px;}.card small{color:var(--mut);font-size:12px}
.btn{padding:12px 16px;border:0;border-radius:14px;background:rgba(255,255,255,0.08);color:var(--fg);font-weight:700;font-size:14px;cursor:pointer;transition:.2s;border:1px solid rgba(255,255,255,0.05);white-space:nowrap;}
.btn.pri{background:var(--ac);color:#10130a;box-shadow:0 0 20px rgba(182,255,60,0.3);border:0}
.btn.pk{background:var(--ac2);color:#fff;box-shadow:0 0 20px rgba(255,60,172,0.3);border:0}
.btn:disabled{opacity:0.5;filter:grayscale(1);cursor:not-allowed;}
#tapw{display:flex;flex-direction:column;align-items:center;padding-top:10px}
#tap{width:200px;height:200px;border-radius:50%;border:4px solid rgba(255,255,255,0.1);background:radial-gradient(circle at 35% 30%,#d6ff7a,var(--ac) 55%,#6aa010);color:#10130a;box-shadow:0 0 60px rgba(182,255,60,.4);transition:transform .06s;position:relative;touch-action:manipulation;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#tap:active{transform:scale(.92)}
#tap svg{width:90px;height:90px;filter:drop-shadow(0 10px 10px rgba(0,0,0,0.3));}
.tap-val{font-size:24px;font-weight:900;margin-top:15px;color:var(--ac);text-align:center;}
.upgrades {width:100%;margin-top:20px;}
.up-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.up-card-info b{font-size:16px;display:block;margin-bottom:4px;}
.up-card-info small{color:var(--mut);font-size:12px;}
.stand-container {position: relative;width: 100%;height: 440px;background: radial-gradient(circle at 50% 30%, #1a1a24 0%, #09090b 80%);border-radius: 24px;border: 1px solid var(--card-border);margin-bottom: 15px;display: flex;justify-content: center;align-items: flex-end;overflow: hidden;box-shadow: inset 0 0 50px rgba(0,0,0,0.8);}
.stand-spotlight {position: absolute;top: 10%;width: 180px;height: 180px;background: var(--ac);filter: blur(90px);opacity: 0.15;border-radius: 50%;}
.stand-podium {position: absolute;bottom: 15px;width: 220px;height: 30px;background: linear-gradient(to bottom, #222, #111);border-radius: 50%;border-bottom: 2px solid #333;box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 20px rgba(182,255,60,0.15);}
.mannequin-wrapper {position: relative;width: 160px;height: 340px;margin-bottom: 20px;z-index: 2;}
.mannequin-base {width: 100%;height: 100%;display: block;}
.eq-item {position: absolute;width: 100px;height: 100px;transform-origin: center center;filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));pointer-events: none;}
.eq-item svg {width: 100%;height: 100%;}
.slot-btn{background:var(--card);border:1px solid var(--card-border);padding:10px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;cursor:pointer;transition:0.2s;position:relative;}
.slot-btn:active {transform: scale(0.98);}
.slot-btn b{font-size:14px;}
.slot-btn small{color:var(--mut);font-size:12px;margin-left:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}
.slot-unequip{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#ff4444;color:#fff;border:none;font-size:14px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;}
.shop-controls {display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;}
.shop-search {width: 100%; padding: 14px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--card-border); color: var(--fg); font-size: 15px; outline: none; transition: 0.2s;}
.shop-search:focus {border-color: var(--ac); box-shadow: 0 0 15px rgba(182,255,60,0.2);}
.shop-filters {display: flex;gap: 8px;overflow-x: auto;padding-bottom: 5px;scrollbar-width: none;}
.shop-filters::-webkit-scrollbar {display: none;}
.filter-btn {padding: 8px 16px;border-radius: 20px;background: var(--card);border: 1px solid var(--card-border);color: var(--mut);font-size: 13px;font-weight: 700;white-space: nowrap;cursor: pointer;transition: 0.2s;}
.filter-btn.on {background: var(--ac);color: #10130a;border-color: var(--ac);}
.top-tabs {display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none;}
.top-tabs::-webkit-scrollbar {display: none;}
.top-tab {padding: 10px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--card-border); color: var(--mut); font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap;}
.top-tab.on {background: var(--ac2); color: #fff; border-color: var(--ac2); box-shadow: 0 0 15px rgba(255,60,172,0.3);}
.top-row {display: flex; align-items: center; gap: 12px; background: var(--card); padding: 12px 16px; border-radius: 16px; margin-bottom: 8px; border: 1px solid var(--card-border);cursor:pointer;transition:.15s;}
.top-row:active {transform: scale(0.98);}
.top-row.me {border-color: var(--ac); background: rgba(182,255,60,0.1);}
.top-row .pos {font-size: 16px; font-weight: 900; color: var(--mut); width: 25px; text-align: center;}
.top-row.me .pos {color: var(--ac);}
.top-row .name {flex: 1; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.top-row .val {font-weight: 900; font-size: 14px; color: var(--ac);}
.top-row.me .val {color: var(--ac); text-shadow: 0 0 10px rgba(182,255,60,0.3);}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);z-index:100;display:none;flex-direction:column;justify-content:flex-end;}
.modal.open{display:flex;}
.modal-content{background:var(--bg);border-top-left-radius:24px;border-top-right-radius:24px;max-height:75vh;overflow-y:auto;padding:20px;border-top:1px solid var(--card-border);animation: slideUp 0.3s ease;}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:2;}
.modal-header h3{margin:0;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:0.2s;position:relative;}
.cell:active{transform:scale(0.95);}
.cell.own{border-color:rgba(255,255,255,0.1);}
.cell.rarity-1{border-color:#b36bff;box-shadow:0 0 10px rgba(179,107,255,0.3);}
.cell.rarity-2{border-color:#ffb02e;box-shadow:0 0 10px rgba(255,176,46,0.3);}
.cell.rarity-3{border-color:#ff3cac;box-shadow:0 0 15px rgba(255,60,172,0.5);}
.cell .artw{width:60px;height:60px;}
.cell .sell-btn{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#ff4444;color:#fff;border:none;font-size:14px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 2px 8px rgba(255,60,60,0.5);}
.artw{display:block;width:100%;height:100%;}
.artw svg{width:100%;height:100%;display:block;}
input[type=range] {-webkit-appearance: none;width: 100%;height: 6px;background: rgba(255,255,255,0.1);border-radius: 3px;outline: none;}
input[type=range]::-webkit-slider-thumb {-webkit-appearance: none;width: 22px;height: 22px;background: var(--ac);border-radius:50%;cursor: pointer;box-shadow: 0 0 10px rgba(182,255,60,0.5);border: 2px solid #10130a;}
.promo-inp {flex: 1;padding: 12px;border-radius: 10px;border: 1px solid var(--card-border);background: rgba(0,0,0,0.5);color: var(--fg);font-size: 14px;outline: none;text-transform: uppercase;font-weight: 700;letter-spacing: 1px;}
.promo-inp:focus {border-color: var(--ac);}
.contact-link {display:flex; justify-content:space-between; align-items:center; padding:12px 0; text-decoration:none; color:var(--fg); border-bottom:1px solid rgba(255,255,255,0.05); transition:0.2s;}
.contact-link:last-child {border-bottom:none;}
.contact-link:active {opacity:0.7;}
.contact-link span {font-weight:700; font-size:14px;}
.contact-link small {color:var(--mut); font-size:12px;}
.tg-username {color:var(--ac); font-weight:900;}
.sort-bar{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.sort-bar::-webkit-scrollbar{display:none;}
#toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:400px;}
.toast{padding:12px 20px;border-radius:14px;background:rgba(30,30,40,0.95);border:1px solid var(--card-border);color:var(--fg);font-weight:700;font-size:14px;backdrop-filter:blur(12px);transform:translateY(-20px);opacity:0;transition:0.3s;text-align:center;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-color:var(--ac);color:var(--ac);box-shadow:0 0 20px rgba(182,255,60,0.3);}
.toast.error{border-color:#ff4444;color:#ff6666;box-shadow:0 0 20px rgba(255,60,60,0.3);}
.toast.info{border-color:var(--ac2);color:var(--ac2);}
#float-container{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden;}
.float-text{position:absolute;color:var(--ac);font-weight:900;font-size:22px;pointer-events:none;animation:floatUp 0.9s ease-out forwards;text-shadow:0 0 12px rgba(182,255,60,0.9),0 2px 4px rgba(0,0,0,0.8);white-space:nowrap;}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(1);}100%{opacity:0;transform:translate(-50%,-110px) scale(1.35);}}
.ach-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:12px;margin-bottom:8px;}
.ach-card.unlocked{border-color:var(--ac);background:rgba(182,255,60,0.08);}
.ach-card .ach-icon{font-size:26px;flex:none;}
.ach-card .ach-info{flex:1;}
.ach-card .ach-info b{display:block;font-size:14px;}
.ach-card .ach-info small{color:var(--mut);font-size:11px;}
.ach-card .ach-rew{color:var(--ac);font-weight:900;font-size:13px;}
.ach-card.locked .ach-rew{color:var(--mut);}
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
#splash-screen{position:fixed;inset:0;background:#09090b;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease;opacity:1;pointer-events:none;}
/* === КАЛЕНДАРЬ === */
.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px;}
.cal-cell{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:8px 6px;text-align:center;font-size:10px;transition:.2s;position:relative;}
.cal-cell.done{border-color:var(--ac);background:rgba(182,255,60,0.12);}
.cal-icon{font-size:20px;margin-bottom:4px;filter:grayscale(.5);}
.cal-cell.done .cal-icon{filter:grayscale(0);}
.cal-name{font-weight:700;line-height:1.15;margin-bottom:5px;height:24px;overflow:hidden;}
.cal-bar{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;margin-bottom:4px;}
.cal-bar>div{height:100%;background:var(--ac);transition:.3s;}
.cal-rew{color:var(--ac);font-weight:900;font-size:10px;}
.cal-cell.done .cal-rew{color:var(--ac2);}
.month-hdr{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px;}
.month-hdr small{color:var(--mut);font-size:12px;}
/* === ЧЁРНЫЙ РЫНОК === */
.bm-banner{background:linear-gradient(135deg,rgba(255,60,172,0.18),rgba(0,0,0,0.4));border:1px solid var(--ac2);}
.bm-timer{color:var(--ac);font-weight:900;}
</style>
</head>
<body>

<div id="splash-screen">
    <div style="font-size:70px;margin-bottom:20px;animation:pulse 2s infinite;filter:drop-shadow(0 0 20px rgba(182,255,60,0.5));">👑</div>
    <h2 style="color:#b6ff3c;margin:0 0 5px;font-size:24px;letter-spacing:1px;">DRIP SHOP</h2>
    <div style="color:#8b8b99;font-size:14px;margin-bottom:30px;">Сделано с душой</div>
    <div style="color:#fff;font-size:18px;font-weight:bold;margin-bottom:5px;">Создатель: @iticov</div>
    <div style="color:#8b8b99;font-size:14px;">Помощник: @ro9mbo</div>
</div>

<div id="sub-gate" style="position: fixed; inset: 0; background: #09090b; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;">
    <div style="font-size: 60px; margin-bottom: 20px; animation: pulse 2s infinite;">🔥</div>
    <h1 style="font-size: 28px; color: #b6ff3c; margin: 0 0 10px;">DRIP SHOP</h1>
    <p style="color: #8b8b99; font-size: 14px; margin-bottom: 30px; line-height: 1.5;">Чтобы начать играть, подпишись на наш Telegram-канал!<br>Там промокоды, конкурсы и новости.</p>
    <a href="https://t.me/DRIPSGAMES" target="_blank" style="width: 100%; max-width: 300px; padding: 16px; font-size: 16px; background: #b6ff3c; color: #000; font-weight: bold; border-radius: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px;">
        📢 Подписаться на @DRIPSGAMES
    </a>
    <button id="check-sub" style="width: 100%; max-width: 300px; padding: 16px; font-size: 16px; background: #ff3cac; color: #fff; font-weight: bold; border-radius: 14px; border: none; cursor: pointer;">
        Я подписался ✅
    </button>
</div>

<div id="toast-container"></div>
<div id="float-container"></div>

<audio id="bg-music" loop><source src="music.mp3" type="audio/mpeg"></audio>
<div id="app">
 <header>
  <div id="bal">0 ₽</div>
  <div id="sub">+0 ₽/сек</div>
  <div id="rank">🔥 Уличный дриппер</div>
 </header>
 <main id="main"></main>
 <nav id="nav">
  <button data-t="tap" class="on"><svg viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>Кликер</button>
  <button data-t="shop"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>Шоп</button>
  <button data-t="inv"><svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 16H4V8h16v12z"/></svg>Вещи</button>
  <button data-t="stand"><svg viewBox="0 0 24 24"><path d="M12 2c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 6c-1.1 0-2 .9-2 2v4c0 .55.45 1 1 1h.5v6c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-6h.5c.55 0 1-.45 1-1v-4c0-1.1-.9-2-2-2h-2z"/></svg>Стенд</button>

const BM_CYCLE_MS = 4 * 3600 * 1000;
const BM_MAX_DISCOUNT = 35;

function getBM() {
  const cycle = Math.floor(Date.now() / BM_CYCLE_MS);
  if (!S.bm || S.bm.cycle !== cycle) {
    const legendaries = ITEMS.filter(i => i.r === 3);
    let seed = cycle >>> 0;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const used = new Set(); const items = [];
    let guard = 0;
    while (items.length < 3 && guard++ < 500) {
      const idx = Math.floor(rnd() * legendaries.length);
      if (used.has(idx)) continue;
      used.add(idx);
      items.push({ id: legendaries[idx].id, discount: 20 + Math.floor(rnd() * (BM_MAX_DISCOUNT - 19)) });
    }
    S.bm = { cycle, items, bought: {} };
    save();
  }
  return S.bm;
}
function openBM() {
  renderBM();
  document.getElementById('bm-modal').classList.add('open');
  if (window._bmTimer) clearInterval(window._bmTimer);
  window._bmTimer = setInterval(() => {
    if (!document.getElementById('bm-modal').classList.contains('open')) { clearInterval(window._bmTimer); return; }
    renderBM();
  }, 15000);
}
function renderBM() {
  const bm = getBM();
  const left = (bm.cycle + 1) * BM_CYCLE_MS - Date.now();
  const hh = Math.floor(left / 3600000), mm = Math.floor((left % 3600000) / 60000), ss = Math.floor((left % 60000) / 1000);
  let html = `<p style="color:var(--mut);font-size:13px;margin:0 0 12px;text-align:center;">🔄 Обновление через <span class="bm-timer">${hh}ч ${mm}м ${ss}с</span></p>`;
  html += `<p style="color:var(--mut);font-size:12px;margin:0 0 12px;text-align:center;">Эксклюзивные легендарки со скидкой. Каждые 4 часа — новые.</p>`;
  html += '<div style="display:flex;flex-direction:column;gap:10px;">';
  bm.items.forEach(o => {
    const item = IM[o.id]; if (!item) return;
    const price = Math.floor(item.p * (1 - o.discount / 100));
    const bought = bm.bought[o.id];
    const owned = !!S.own[o.id];
    html += `<div class="card"><div class="ic">${artSpan(item)}</div><div class="t"><b>${esc(item.n)}</b><small style="color:var(--ac2);font-weight:900;">🔥 -${o.discount}%</small><br><small style="text-decoration:line-through;color:var(--mut);">${fmt(item.p)} ₽</small> <small style="color:var(--ac);font-weight:bold;">→ ${fmt(price)} ₽</small></div><button class="btn pri" onclick="buyBM('${o.id}')" ${bought||owned?'disabled':''}>${bought?'Куплено':owned?'Есть':'Купить'}</button></div>`;
  });
  html += '</div>';
  document.getElementById('bm-content').innerHTML = html;
}
function buyBM(id) {
  const bm = getBM();
  const offer = bm.items.find(x => x.id === id); if (!offer) return;
  if (bm.bought[id]) { toast('Уже куплено в этом цикле', 'error'); return; }
  if (S.own[id]) { toast('У тебя уже есть эта вещь', 'error'); SFX.error(); return; }
  const item = IM[id]; if (!item) return;
  const price = Math.floor(item.p * (1 - offer.discount / 100));
  if (S.r < price) { toast('Мало кэша!', 'error'); SFX.error(); return; }
  S.r -= price;
  S.own[id] = 1;
  if (S.mp) { S.mp.prog.bought++; S.mp.prog.spent += price; }
  bm.bought[id] = true;
  save(); head(); checkMonthlyAch(); renderBM();
  toast(`🖤 Куплено: ${item.n}`, 'success');
  SFX.buy();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

// ===== PROMO =====
function applyPromo() {
    const input = document.getElementById('promo-input'); if (!input) return;
    const code = input.value.trim().toUpperCase(); if (!code) return;
    if (!S.promos) S.promos = {};
    if (S.promos[code]) { toast('Промокод уже активирован!', 'error'); SFX.error(); return; }
    const reward = PROMOS[code];
    if (!reward) { toast('Неверный промокод ❌', 'error'); SFX.error(); return; }
    S.r += reward.r; S.promos[code] = true;
    if (S.mp) { S.mp.prog.earned += reward.r; }
    save(); head(); view();
    toast(`✅ Промокод ${code}: +${fmt(reward.r)} ₽`, 'success');
    SFX.buy();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    checkAchievements();
    checkMonthlyAch();
}
function resetGame() {
    if (confirm('Точно сбросить весь прогресс? Это нельзя отменить.')) {
        localStorage.removeItem('drip12');
        S = { r: 0, own: {}, eq: {}, tapLvl: 1, autoLvl: 0, promos: {}, taps: 0, timePlayed: 0, lastSeen: Date.now(), ach: {}, lastDaily: 0, dailyStreak: 0, soundOn: S.soundOn, mp: null, bm: null, uid: S.uid };
        initMonthly();
        save(); head(); view();
        toast('Прогресс сброшен', 'info');
    }
}

function getRank() {
    if (S.r > 10000000) return '🔥 Император дрипа';
    if (S.r > 1000000) return '🔥 Легенда улиц';
    if (S.r > 500000) return '🔥 Мажор';
    if (S.r > 100000) return '🔥 Дрипушник';
    if (S.r > 50000) return '🔥 Уличный';
    return '🔥 Уличный дриппер';
}

function head() {
    $('bal').textContent = fmt(S.r) + ' ₽';
    $('sub').textContent = '+' + fmt(getAutoValue()) + ' ₽/сек (x' + getStandBonus().toFixed(2) + ')';
    $('rank').textContent = getRank();
}

let tab='tap'; let shopLimit = 20; let invLimit = 20; let shopFilter = 'all'; let searchQuery = ''; let topTab = 'money'; let realTopData = []; let invSort = 'new';
let searchDebounceTimer = null;

const CATEGORIES = { 'all': { name: 'Все', types: null }, 'top': { name: 'Верх', types: ['hood', 'tee', 'puff', 'jack'] }, 'bot': { name: 'Низ', types: ['jeans', 'cargo', 'boxers'] }, 'shoe': { name: 'Обувь', types: ['sneak', 'socks', 'drill'] }, 'head': { name: 'Голова', types: ['cap', 'mask', 'shades'] }, 'acc': { name: 'Аксессуары', types: ['chain', 'bag', 'pack', 'watch', 'belt'] } };

// ===== SUPABASE =====
let lastSync = 0;
async function syncWithServer(force) {
    if (!force && Date.now() - lastSync < 30000) return;
    lastSync = Date.now();
    const { error } = await _supabase.from('leaderboard').upsert({
        name: myName,
        money: Math.floor(S.r),
        taps: S.taps,
        time_played: S.timePlayed,
        set_value: getStandValue(),
        eq: S.eq,
        ach_count: Object.keys(S.ach||{}).length
    }, { onConflict: 'name' });
    if (error) { console.error('Sync error:', error.message); }
}
async function loadTopFromServer() {
    const { data, error } = await _supabase.from('leaderboard').select('*').order('money', { ascending: false }).limit(50);
    if (error) { console.error('Load error:', error); return; }
    realTopData = data.map(p => ({ name: p.name, money: p.money, taps: p.taps, timePlayed: p.time_played, setValue: p.set_value, eq: p.eq, achCount: p.ach_count }));
    if (tab === 'top' || tab === 'profile') view();
}

function setTopTab(t) { topTab = t; view(); }
function setInvSort(t) { invSort = t; view(); }

function getTopList() {
    let allPlayers = realTopData.length > 0 ? [...realTopData] : [];
    const meInList = allPlayers.find(p => p.name === myName);
    if (!meInList) {
        allPlayers.push({ name: myName, money: Math.floor(S.r), taps: S.taps, timePlayed: S.timePlayed, setValue: getStandValue(), eq: S.eq, achCount: Object.keys(S.ach||{}).length });
    } else {
        meInList.money = Math.floor(S.r); meInList.taps = S.taps;
        meInList.timePlayed = S.timePlayed; meInList.setValue = getStandValue();
        meInList.eq = S.eq; meInList.achCount = Object.keys(S.ach||{}).length;
    }
    if (topTab === 'money') allPlayers.sort((a, b) => b.money - a.money);
    else if (topTab === 'taps') allPlayers.sort((a, b) => b.taps - a.taps);
    else if (topTab === 'time') allPlayers.sort((a, b) => b.timePlayed - a.timePlayed);
    else if (topTab === 'set') allPlayers.sort((a, b) => b.setValue - a.setValue);
    return allPlayers.map(p => ({ ...p, isMe: p.name === myName }));
}
function formatTime(seconds) { const h = Math.floor(seconds / 3600); const m = Math.floor((seconds % 3600) / 60); if (h > 0) return `${h}ч ${m}м`; return `${m}м`; }
function setShopFilter(f) { shopFilter = f; shopLimit = 20; view(); }

function onSearchInput(val) {
    searchQuery = val;
    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
        shopLimit = 20;
        const displayItems = getFilteredItems();
        const container = document.getElementById('shop-items');
        if (container) container.innerHTML = renderShopItems(displayItems);
    }, 150);
}

function getFilteredItems() {
    let displayItems = ITEMS;
    if (shopFilter !== 'all') { const allowed = CATEGORIES[shopFilter].types; displayItems = displayItems.filter(i => allowed.includes(i.t)); }
    if (searchQuery) { const q = searchQuery.toLowerCase(); displayItems = displayItems.filter(i => i.n.toLowerCase().includes(q)); }
    return displayItems;
}

function renderShopItems(displayItems) {
    if (displayItems.length === 0) return '<p style="text-align:center;color:var(--mut);margin-top:20px;">Ничего не найдено</p>';
    let html = displayItems.slice(0, shopLimit).map(i => {
        const o = S.own[i.id];
        return `<div class="card"><div class="ic">${artSpan(i)}</div><div class="t"><b>${esc(i.n)}</b><small style="color:var(--ac2)">${['Обычная','Редкая','Эпик','Легенда'][i.r]}</small><br><small>${fmt(i.p)} ₽</small></div><button class="btn ${o?'':'pri'}" onclick="buy('${i.id}')" ${o?'disabled':''}>${o?'Есть':'Купить'}</button></div>`;
    }).join('');
    if (shopLimit < displayItems.length) html += `<button class="btn" onclick="shopLimit += 20; view();" style="width:100%; margin-top:10px;">Показать еще (${shopLimit} из ${displayItems.length})</button>`;
    return html;
}

function getSortedOwned() {
    const owned = ITEMS.filter(i => S.own[i.id]);
    if (invSort === 'price') owned.sort((a, b) => b.p - a.p);
    else if (invSort === 'rarity') owned.sort((a, b) => b.r - a.r || b.p - a.p);
    return owned;
}

// ===== ОСНОВНОЙ РЕНДЕР =====
function view() {
    const scrollPos = $('main').scrollTop;
    const m = $('main');
    let h = '';

    if (tab === 'tap') {
        h = `<div id="tapw"><div id="tap"><svg viewBox="0 0 100 100" fill="none"><path d="M30 35 C30 15, 70 15, 70 35" stroke="#000" stroke-width="6" stroke-linecap="round"/><path d="M20 45 L80 45 L90 90 C90 95, 85 100, 80 100 L20 100 C15 100, 10 95, 10 90 L20 45Z" fill="#10130a"/><text x="50" y="82" font-size="40" font-weight="900" fill="#b6ff3c" text-anchor="middle">$</text></svg></div><div class="tap-val">+${fmt(getTapValue())} ₽ за тап</div>`;
        const daily = checkDaily();
        if (daily.canClaim) {
            const idx = Math.min(daily.streak, 6);
            h += `<div class="card" onclick="claimDaily()" style="background:rgba(182,255,60,0.1);border-color:var(--ac);cursor:pointer;margin-top:15px;width:100%;"><div class="ic">🎁</div><div class="t"><b>Ежедневная награда!</b><small>День ${daily.streak + 1} — ${fmt(DAILY[idx])} ₽</small></div><button class="btn pri">Забрать</button></div>`;
        }
        h += `<div class="card bm-banner" onclick="openBM()" style="cursor:pointer;margin-top:10px;width:100%;"><div class="ic" style="background:rgba(255,60,172,0.2);">🖤</div><div class="t"><b style="color:var(--ac2);">Чёрный Рынок</b><small>Легендарки со скидкой до 35%</small></div><button class="btn pk">Открыть</button></div>`;
        h += `<div class="upgrades"><div class="up-card"><div class="up-card-info"><b>👆 Сила Тапа</b><small>Увеличивает доход за клик</small></div><button class="btn pri" onclick="buyUpgrade('tap')" ${S.r < getTapCost() ? 'disabled' : ''}>Ур. ${S.tapLvl} | ${fmt(getTapCost())} ₽</button></div><div class="up-card"><div class="up-card-info"><b>🤖 Автокликер</b><small>Дает пассивный доход</small></div><button class="btn pk" onclick="buyUpgrade('auto')" ${S.r < getAutoCost() ? 'disabled' : ''}>Ур. ${S.autoLvl} | ${fmt(getAutoCost())} ₽</button></div></div></div>`;
    } else if (tab === 'shop') {
        h = '<h3 style="margin-top:0">Дрип Шоп</h3><div class="shop-controls">';
        h += `<input type="text" id="shop-search" class="shop-search" placeholder="🔍 Поиск (например: часы, худи, Gucci...)" value="${searchQuery}" oninput="onSearchInput(this.value)" autocomplete="off"><div class="shop-filters">`;
        for (let key in CATEGORIES) h += `<button class="filter-btn ${shopFilter === key ? 'on' : ''}" onclick="setShopFilter('${key}')">${CATEGORIES[key].name}</button>`;
        h += '</div></div>';
        const displayItems = getFilteredItems();
        h += `<div id="shop-items">${renderShopItems(displayItems)}</div>`;
    } else if (tab === 'inv') {
        h = '<h3 style="margin-top:0">Твой Инвентарь</h3>';
        const owned = getSortedOwned();
        if (!owned.length) {
            h += '<p style="text-align:center;color:var(--mut);margin-top:20px;">Пока пусто. Купи шмот в магазине!</p>';
        } else {
            h += `<div class="sort-bar"><button class="filter-btn ${invSort==='new'?'on':''}" onclick="setInvSort('new')">Новые</button><button class="filter-btn ${invSort==='price'?'on':''}" onclick="setInvSort('price')">По цене</button><button class="filter-btn ${invSort==='rarity'?'on':''}" onclick="setInvSort('rarity')">По редкости</button></div>`;
            h += '<div class="grid">';
            owned.slice(0, invLimit).forEach(i => {
                h += `<div class="cell rarity-${i.r} ${S.own[i.id] ? 'own' : ''}">${artSpan(i, true)}<span style="font-size:9px;margin-top:4px;line-height:1.1;height:20px;overflow:hidden;">${esc(i.n)}</span><button class="sell-btn" onclick="event.stopPropagation(); sell('${i.id}')">×</button></div>`;
            });
            h += '</div>';
            if (invLimit < owned.length) h += `<button class="btn" onclick="invLimit += 20; view();" style="width:100%; margin-top:10px;">Показать еще</button>`;
         } else if (tab === 'stand') {
        h = '<h3 style="margin-top:0">Твой Стенд</h3>';
        const eqArray = Object.keys(SLOTS).map(slot => ({slot, item: IM[S.eq[slot]], pos: EQ_POS[slot]})).filter(x=>x.item).sort((a,b)=>a.pos.z-b.pos.z);
        let standHtml = '';
        eqArray.forEach(x => { standHtml += `<div class="eq-item" style="top:${x.pos.top};left:${x.pos.left};transform:translate(-50%,-50%) scale(${x.pos.scale});z-index:${x.pos.z};">${artSpan(x.item, true)}</div>`; });
        h += `<div class="stand-container"><div class="stand-spotlight"></div><div class="stand-podium"></div><div class="mannequin-wrapper">${MANNEQUIN_SVG}${standHtml}</div></div>`;
        h += `<div class="card" style="justify-content:space-between;"><div><b>Стоимость стенда</b></div><div style="color:var(--ac);font-weight:900;">${fmt(getStandValue())} ₽</div></div>`;
        h += `<div class="card" style="justify-content:space-between;"><div><b>Бонус к доходу</b></div><div style="color:var(--ac);font-weight:900;">x${getStandBonus().toFixed(2)}</div></div>`;
        for (let slot in SLOTS) {
            const item = IM[S.eq[slot]];
            h += `<div class="slot-btn" onclick="openSelect('${slot}')"><div><b>${SLOT_NAMES[slot]}</b><small>${item ? esc(item.n) : 'Пусто'}</small></div>${item ? `<button class="slot-unequip" onclick="event.stopPropagation(); unequip('${slot}')">×</button>` : '<span style="color:var(--mut)">></span>'}</div>`;
        }
    } else if (tab === 'top') {
        h = '<h3 style="margin-top:0">Лидерборд</h3><div class="top-tabs">';
        ['money','taps','time','set'].forEach(t => {
            const names = {money:'💰 Деньги', taps:'👆 Клики', time:'⏱ Время', set:'👕 Стенд'};
            h += `<button class="top-tab ${topTab===t?'on':''}" onclick="setTopTab('${t}')">${names[t]}</button>`;
        });
        h += `</div>`;
        const list = getTopList(); _lastTopList = list;
        list.forEach((p, idx) => {
            let val = p.money, suffix = ' ₽';
            if (topTab === 'taps') { val = p.taps; suffix = ' клик.'; }
            else if (topTab === 'time') { val = p.timePlayed; suffix = ''; }
            else if (topTab === 'set') { val = p.setValue; suffix = ' ₽'; }
            h += `<div class="top-row ${p.isMe?'me':''}" onclick="openPlayerProfileByIndex(${idx})"><div class="pos">${idx+1}</div><div class="name">${esc(p.name)}</div><div class="val">${topTab==='time'?formatTime(val):fmtShort(val)}${suffix}</div></div>`;
        });
    } else if (tab === 'profile') {
        h = '<h3 style="margin-top:0">Профиль</h3>';
        h += `<div class="card" style="justify-content:space-between;"><div><b>Кликов</b></div><div style="color:var(--ac);font-weight:900;">${fmt(S.taps)}</div></div><div class="card" style="justify-content:space-between;"><div><b>Время в игре</b></div><div style="color:var(--ac);font-weight:900;">${formatTime(S.timePlayed)}</div></div><div class="card" style="justify-content:space-between;"><div><b>Ачивок</b></div><div style="color:var(--ac);font-weight:900;">${Object.keys(S.ach).length} / ${ACHS.length}</div></div>`;
        if (S.mp) {
            h += `<div class="month-hdr"><h4 style="margin:0;">Календарь на ${MONTHS_RU[new Date().getMonth()]}</h4><small>Дней: ${S.mp.prog.days}</small></div><div class="cal-grid">`;
            S.mp.list.forEach(id => {
                const a = MONTH_ACH_MAP[id]; if(!a) return;
                const done = !!S.mp.claimed[id], pct = Math.min(100, Math.round(getMP(a.type) / a.target * 100));
                h += `<div class="cal-cell ${done?'done':''}"><div class="cal-icon">${a.icon}</div><div class="cal-name">${a.name}</div><div class="cal-bar"><div style="width:${done?100:pct}%"></div></div><div class="cal-rew">${fmtShort(a.rew)} ₽</div></div>`;
            });
            h += '</div>';
        }
        h += '<h3 style="margin-top:20px;">🏆 Достижения</h3>';
        ACHS.forEach(a => {
            const unlocked = S.ach[a.id];
            h += `<div class="ach-card ${unlocked?'unlocked':'locked'}"><div class="ach-icon">${a.icon}</div><div class="ach-info"><b>${a.name}</b><small>${a.desc}</small></div><div class="ach-rew">${unlocked?'✓':fmtShort(a.rew)+' ₽'}</div></div>`;
        });
    } else if (tab === 'settings') {
        h = `<h3 style="margin-top:0">Настройки</h3><div class="card" style="flex-direction:column;align-items:stretch;gap:10px;"><b>Промокод</b><div style="display:flex;gap:8px;"><input id="promo-input" class="promo-inp" placeholder="Введи код..."><button class="btn pri" onclick="applyPromo()">ОК</button></div></div>`;
        h += `<div class="card" style="justify-content:space-between;"><div><b>Звуки</b></div><button class="btn" onclick="toggleSound()">${S.soundOn?'🔊 Вкл':'🔇 Выкл'}</button></div><div class="card" style="flex-direction:column;align-items:stretch;gap:10px;"><div style="display:flex;justify-content:space-between;"><b>Музыка</b><span id="vol-label">${musicVolume}%</span></div><input type="range" min="0" max="100" value="${musicVolume}" oninput="setVolume(this.value)"></div>`;
        h += `<div class="card" style="flex-direction:column;align-items:stretch;"><a href="https://t.me/iticov" class="contact-link" target="_blank"><span>Создатель</span><small class="tg-username">@iticov</small></a><a href="https://t.me/ro9mbo" class="contact-link" target="_blank"><span>Помощник</span><small class="tg-username">@ro9mbo</small></a></div><button class="btn" style="width:100%;color:#ff4444;border-color:#ff4444;margin-top:10px;" onclick="resetGame()">Сбросить прогресс</button>`;
    }
    m.innerHTML = h; m.scrollTop = scrollPos; syncWithServer(false); checkAchievements();
    if(tab==='shop' && searchQuery) { const inp = document.getElementById('shop-search'); if(inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
    if(tab==='tap') { const tapEl = $('tap'); if(tapEl) tapEl.addEventListener('pointerdown', handleTap); }
}

function handleTap(e) {
    ensureAudio(); const val = getTapValue(); S.r += val; S.taps++;
    if(S.mp) { S.mp.prog.taps++; S.mp.prog.earned += val; }
    head(); if(e && e.clientX) floatText(e.clientX, e.clientY, '+' + fmt(val)); SFX.tap();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    $('bal').classList.add('bump'); setTimeout(()=>$('bal').classList.remove('bump'), 150); checkMonthlyAch();
}

function buy(id) {
    const item = IM[id]; if (!item || S.own[id] || S.r < item.p) { if(!S.own[id]) { toast('Мало кэша!', 'error'); SFX.error(); } return; }
    S.r -= item.p; S.own[id] = 1; if (S.mp) { S.mp.prog.bought++; S.mp.prog.spent += item.p; }
    save(); head(); view(); toast(`🛍 Куплено: ${item.n}`, 'success'); SFX.buy();
    if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); checkMonthlyAch();
}

function sell(id) {
    const item = IM[id]; if (!item || !S.own[id]) return;
    const price = Math.floor(item.p * 0.6);
    if (!confirm(`Продать "${item.n}" за ${fmt(price)} ₽?`)) return;
    S.r += price; delete S.own[id]; if (S.mp) { S.mp.prog.sold++; S.mp.prog.earned += price; }
    for (let slot in S.eq) if (S.eq[slot] === id) delete S.eq[slot];
    save(); head(); view(); toast(`💸 Продано за ${fmt(price)} ₽`, 'success'); SFX.sell(); checkMonthlyAch();
}

function buyUpgrade(type) {
    if (type === 'tap') { const cost = getTapCost(); if (S.r < cost) return; S.r -= cost; S.tapLvl++; if (S.mp) S.mp.prog.spent += cost; } 
    else { const cost = getAutoCost(); if (S.r < cost) return; S.r -= cost; S.autoLvl++; if (S.mp) S.mp.prog.spent += cost; }
    save(); head(); view(); SFX.buy(); checkMonthlyAch(); if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
}

function openSelect(slot) {
    const allowedTypes = SLOTS[slot], ownedInSlot = ITEMS.filter(i => S.own[i.id] && allowedTypes.includes(i.t));
    document.getElementById('modal-title').innerText = 'Выбери: ' + SLOT_NAMES[slot];
    let h = ownedInSlot.length === 0 ? '<p style="text-align:center;color:var(--mut);grid-column:1/-1;">Нет вещей для этого слота</p>' : '';
    ownedInSlot.forEach(i => { h += `<div class="cell rarity-${i.r} ${S.eq[slot] === i.id?'own':''}" onclick="equip('${slot}','${i.id}')">${artSpan(i, true)}<span style="font-size:9px;margin-top:4px;line-height:1.1;height:20px;overflow:hidden;">${esc(i.n)}</span></div>`; });
    document.getElementById('modal-list').innerHTML = h; document.getElementById('select-modal').classList.add('open');
}

function closeModal() { document.getElementById('select-modal').classList.remove('open'); }
function equip(slot, id) { if (S.eq[slot] === id) delete S.eq[slot]; else S.eq[slot] = id; save(); closeModal(); view(); SFX.equip(); if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); }
function unequip(slot) { delete S.eq[slot]; save(); view(); SFX.equip(); }

document.querySelectorAll('#nav button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('#nav button').forEach(b => b.classList.remove('on')); btn.classList.add('on');
        tab = btn.dataset.t; if(tab==='shop') shopLimit = 20; if(tab==='inv') invLimit = 20; view();
    });
});

function initGame() {
    $('splash-screen').style.opacity = '0'; setTimeout(() => $('splash-screen').style.display = 'none', 500);
    const subGate = $('sub-gate'), checkSubBtn = $('check-sub');
    const showApp = () => { subGate.style.display = 'none'; $('app').style.display = 'flex'; initMonthly(); head(); view(); syncWithServer(true); loadTopFromServer(); };
    if(localStorage.getItem('sub_checked')) showApp();
    checkSubBtn.addEventListener('click', () => { checkSubBtn.innerText = 'Проверяем...'; setTimeout(() => { localStorage.setItem('sub_checked', '1'); showApp(); }, 1500); });
    if (S.lastSeen) {
        const offlineSec = Math.floor((Date.now() - S.lastSeen) / 1000);
        if (offlineSec > 10 && getAutoValue() > 0) {
            const offlineEarn = Math.floor(getAutoValue() * (offlineSec * 0.5));
            if (offlineEarn > 0) { S.r += offlineEarn; if(S.mp) S.mp.prog.earned += offlineEarn; setTimeout(() => toast(`💤 Оффлайн-доход: +${fmt(offlineEarn)} ₽`, 'success'), 1500); }
        }
    }
    save();
}

setInterval(() => { S.r += getAutoValue(); if(S.mp) S.mp.prog.earned += getAutoValue(); S.timePlayed++; head(); if(S.timePlayed % 10 === 0) { save(); syncWithServer(false); } }, 1000);
setInterval(() => { save(); checkAchievements(); checkMonthlyAch(); }, 5000);
setInterval(() => { if (tab === 'top') loadTopFromServer(); }, 60000);
document.addEventListener('click', (e) => { if (e.target.classList.contains('modal')) e.target.classList.remove('open'); });
initGame();
</script>
