<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DRIP SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:rgba(30,30,40,0.85);--card-border:rgba(255,255,255,0.1);--fg:#f4f4f6;--mut:#8b8b99;--ac:#b6ff3c;--ac2:#ff3cac;--blur:blur(12px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;z-index:10;display:none;}
header{padding:20px 16px 10px;text-align:center;position:relative;z-index:15;flex:none}
#bal{font-size:38px;font-weight:900;color:var(--ac);letter-spacing:.5px;text-shadow:0 0 15px rgba(182,255,60,.3);transition:transform .15s}
#bal.bump{transform:scale(1.08)}
#sub{font-size:12px;color:var(--mut);margin-top:4px;font-weight:bold;}
#rank{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--card-border);backdrop-filter:var(--blur);font-size:13px;font-weight:700;color:var(--ac2)}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 14px 80px;position:relative;z-index:10}
main::-webkit-scrollbar{display:none}
nav{display:flex;gap:2px;padding:10px 4px;background:rgba(20,20,25,0.95);backdrop-filter:var(--blur);border-top:1px solid var(--card-border);justify-content:space-between;position:absolute;bottom:0;left:0;right:0;z-index:20;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;min-width:0;padding:6px 0;border:0;border-radius:10px;background:transparent;color:var(--mut);font-weight:700;font-size:8px;transition:.2s;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button.on{background:var(--card);border:1px solid var(--card-border);color:var(--ac);box-shadow:0 0 15px rgba(182,255,60,0.1)}
nav svg{width:16px;height:16px;fill:currentColor;}
.card{background:var(--card);backdrop-filter:var(--blur);border:1px solid var(--card-border);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:.2s}
.ic{width:52px;height:52px;border-radius:14px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
.card .t{flex:1;min-width:0}.card b{display:block;font-size:15px;line-height:1.2;margin-bottom:4px;}.card small{color:var(--mut);font-size:12px}
.btn{padding:12px 16px;border:0;border-radius:14px;background:rgba(255,255,255,0.08);color:var(--fg);font-weight:700;font-size:14px;cursor:pointer;transition:.2s;border:1px solid rgba(255,255,255,0.05);white-space:nowrap;}
.btn.pri{background:var(--ac);color:#10130a;box-shadow:0 0 20px rgba(182,255,60,0.3);border:0}
.btn.pk{background:var(--ac2);color:#fff;box-shadow:0 0 20px rgba(255,60,172,0.3);border:0}
.btn:disabled{opacity:0.5;filter:grayscale(1);cursor:not-allowed;}
#tapw{display:flex;flex-direction:column;align-items:center;padding-top:10px}
#tap{width:200px;height:200px;border-radius:50%;border:4px solid rgba(255,255,255,0.1);background:radial-gradient(circle at 35% 30%,#d6ff7a,var(--ac) 55%,#6aa010);color:#10130a;box-shadow:0 0 60px rgba(182,255,60,.4);transition:transform .06s;position:relative;touch-action:manipulation;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#tap:active{transform:scale(.92)}
#tap svg{width:90px;height:90px;filter:drop-shadow(0 10px 10px rgba(0,0,0,0.3));}
.tap-val{font-size:24px;font-weight:900;margin-top:15px;color:var(--ac);text-align:center;}
.upgrades {width:100%;margin-top:20px;}
.up-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.up-card-info b{font-size:16px;display:block;margin-bottom:4px;}
.up-card-info small{color:var(--mut);font-size:12px;}
.stand-container {position: relative;width: 100%;height: 440px;background: radial-gradient(circle at 50% 30%, #1a1a24 0%, #09090b 80%);border-radius: 24px;border: 1px solid var(--card-border);margin-bottom: 15px;display: flex;justify-content: center;align-items: flex-end;overflow: hidden;box-shadow: inset 0 0 50px rgba(0,0,0,0.8);}
.stand-spotlight {position: absolute;top: 10%;width: 180px;height: 180px;background: var(--ac);filter: blur(90px);opacity: 0.15;border-radius: 50%;}
.stand-podium {position: absolute;bottom: 15px;width: 220px;height: 30px;background: linear-gradient(to bottom, #222, #111);border-radius: 50%;border-bottom: 2px solid #333;box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 20px rgba(182,255,60,0.15);}
.mannequin-wrapper {position: relative;width: 160px;height: 340px;margin-bottom: 20px;z-index: 2;}
.mannequin-base {width: 100%;height: 100%;display: block;}
.eq-item {position: absolute;width: 100px;height: 100px;transform-origin: center center;filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));pointer-events: none;}
.eq-item svg {width: 100%;height: 100%;}
.slot-btn{background:var(--card);border:1px solid var(--card-border);padding:10px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;cursor:pointer;transition:0.2s;position:relative;}
.slot-btn:active {transform: scale(0.98);}
.slot-btn b{font-size:14px;}
.slot-btn small{color:var(--mut);font-size:12px;margin-left:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}
.slot-unequip{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#ff4444;color:#fff;border:none;font-size:14px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;}
.shop-controls {display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;}
.shop-search {width: 100%; padding: 14px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--card-border); color: var(--fg); font-size: 15px; outline: none; transition: 0.2s;}
.shop-search:focus {border-color: var(--ac); box-shadow: 0 0 15px rgba(182,255,60,0.2);}
.shop-filters {display: flex;gap: 8px;overflow-x: auto;padding-bottom: 5px;scrollbar-width: none;}
.shop-filters::-webkit-scrollbar {display: none;}
.filter-btn {padding: 8px 16px;border-radius: 20px;background: var(--card);border: 1px solid var(--card-border);color: var(--mut);font-size: 13px;font-weight: 700;white-space: nowrap;cursor: pointer;transition: 0.2s;}
.filter-btn.on {background: var(--ac);color: #10130a;border-color: var(--ac);}
.top-tabs {display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none;}
.top-tabs::-webkit-scrollbar {display: none;}
.top-tab {padding: 10px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--card-border); color: var(--mut); font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap;}
.top-tab.on {background: var(--ac2); color: #fff; border-color: var(--ac2); box-shadow: 0 0 15px rgba(255,60,172,0.3);}
.top-row {display: flex; align-items: center; gap: 12px; background: var(--card); padding: 12px 16px; border-radius: 16px; margin-bottom: 8px; border: 1px solid var(--card-border);}
.top-row.me {border-color: var(--ac); background: rgba(182,255,60,0.1);}
.top-row .pos {font-size: 16px; font-weight: 900; color: var(--mut); width: 25px; text-align: center;}
.top-row.me .pos {color: var(--ac);}
.top-row .name {flex: 1; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.top-row .val {font-weight: 900; font-size: 14px; color: var(--ac);}
.top-row.me .val {color: var(--ac); text-shadow: 0 0 10px rgba(182,255,60,0.3);}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);z-index:100;display:none;flex-direction:column;justify-content:flex-end;}
.modal.open{display:flex;}
.modal-content{background:var(--bg);border-top-left-radius:24px;border-top-right-radius:24px;max-height:75vh;overflow-y:auto;padding:20px;border-top:1px solid var(--card-border);animation: slideUp 0.3s ease;}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:2;}
.modal-header h3{margin:0;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:0.2s;position:relative;}
.cell:active{transform:scale(0.95);}
.cell.own{border-color:rgba(255,255,255,0.1);}
.cell.rarity-1{border-color:#b36bff;box-shadow:0 0 10px rgba(179,107,255,0.3);}
.cell.rarity-2{border-color:#ffb02e;box-shadow:0 0 10px rgba(255,176,46,0.3);}
.cell.rarity-3{border-color:#ff3cac;box-shadow:0 0 15px rgba(255,60,172,0.5);}
.cell .artw{width:60px;height:60px;}
.cell .sell-btn{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#ff4444;color:#fff;border:none;font-size:14px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 2px 8px rgba(255,60,60,0.5);}
.artw{display:block;width:100%;height:100%;}
.artw svg{width:100%;height:100%;display:block;}
input[type=range] {-webkit-appearance: none;width: 100%;height: 6px;background: rgba(255,255,255,0.1);border-radius: 3px;outline: none;}
input[type=range]::-webkit-slider-thumb {-webkit-appearance: none;width: 22px;height: 22px;background: var(--ac);border-radius:50%;cursor: pointer;box-shadow: 0 0 10px rgba(182,255,60,0.5);border: 2px solid #10130a;}
.promo-inp {flex: 1;padding: 12px;border-radius: 10px;border: 1px solid var(--card-border);background: rgba(0,0,0,0.5);color: var(--fg);font-size: 14px;outline: none;text-transform: uppercase;font-weight: 700;letter-spacing: 1px;}
.promo-inp:focus {border-color: var(--ac);}
.contact-link {display:flex; justify-content:space-between; align-items:center; padding:12px 0; text-decoration:none; color:var(--fg); border-bottom:1px solid rgba(255,255,255,0.05); transition:0.2s;}
.contact-link:last-child {border-bottom:none;}
.contact-link:active {opacity:0.7;}
.contact-link span {font-weight:700; font-size:14px;}
.contact-link small {color:var(--mut); font-size:12px;}
.tg-username {color:var(--ac); font-weight:900;}
.sort-bar{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.sort-bar::-webkit-scrollbar{display:none;}
#toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:400px;}
.toast{padding:12px 20px;border-radius:14px;background:rgba(30,30,40,0.95);border:1px solid var(--card-border);color:var(--fg);font-weight:700;font-size:14px;backdrop-filter:blur(12px);transform:translateY(-20px);opacity:0;transition:0.3s;text-align:center;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-color:var(--ac);color:var(--ac);box-shadow:0 0 20px rgba(182,255,60,0.3);}
.toast.error{border-color:#ff4444;color:#ff6666;box-shadow:0 0 20px rgba(255,60,60,0.3);}
.toast.info{border-color:var(--ac2);color:var(--ac2);}
#float-container{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden;}
.float-text{position:absolute;color:var(--ac);font-weight:900;font-size:22px;pointer-events:none;animation:floatUp 0.9s ease-out forwards;text-shadow:0 0 12px rgba(182,255,60,0.9),0 2px 4px rgba(0,0,0,0.8);white-space:nowrap;}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(1);}100%{opacity:0;transform:translate(-50%,-110px) scale(1.35);}}
.ach-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:12px;margin-bottom:8px;}
.ach-card.unlocked{border-color:var(--ac);background:rgba(182,255,60,0.08);}
.ach-card .ach-icon{font-size:26px;flex:none;}
.ach-card .ach-info{flex:1;}
.ach-card .ach-info b{display:block;font-size:14px;}
.ach-card .ach-info small{color:var(--mut);font-size:11px;}
.ach-card .ach-rew{color:var(--ac);font-weight:900;font-size:13px;}
.ach-card.locked .ach-rew{color:var(--mut);}
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
#splash-screen{position:fixed;inset:0;background:#09090b;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease;opacity:1;pointer-events:none;}
/* ===== MINI GAMES ===== */
.g-row{display:flex;gap:8px}
.g-row .btn{flex:1;padding:10px 4px}
.g-inp{width:100%;padding:12px;border-radius:12px;border:1px solid var(--card-border);background:rgba(0,0,0,.5);color:var(--fg);font-size:16px;font-weight:700;outline:none;user-select:text;-webkit-user-select:text}
.g-inp:focus{border-color:var(--ac)}
.crash-mult{font-size:58px;font-weight:900;line-height:1;color:var(--fg)}
.crash-mult.run{color:var(--ac);text-shadow:0 0 25px rgba(182,255,60,.5)}
.crash-mult.win{color:#ffd34d;text-shadow:0 0 25px rgba(255,211,77,.5)}
.crash-mult.dead{color:#ff4444;text-shadow:0 0 25px rgba(255,60,60,.5)}
.hist{display:flex;gap:6px;overflow-x:auto;width:100%;scrollbar-width:none;min-height:26px;margin-bottom:6px}
.hist::-webkit-scrollbar{display:none}
.hist span{flex:none;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:800;background:rgba(0,0,0,.35)}
.mines-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.mtile{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--card-border);font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.mtile:active{transform:scale(.92)}
.mtile.safe{background:rgba(182,255,60,.15);border-color:var(--ac)}
.mtile.mine{background:rgba(255,60,60,.2);border-color:#ff4444}
.mtile.ghost{opacity:.45}
/* ===== КЕЙСЫ ===== */
.case-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:15px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:.2s;cursor:pointer}
.case-card:active{transform:scale(.97)}
.case-emoji{font-size:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.case-name{font-size:14px;font-weight:900}
.case-progress{font-size:11px;color:var(--mut)}
.case-price{color:var(--ac);font-weight:900;font-size:15px}
.case-result-art{width:130px;height:130px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);border:3px solid var(--card-border);margin:0 auto}
</style>
</head>
<body>

<div id="splash-screen">
    <div style="font-size:70px;margin-bottom:20px;animation:pulse 2s infinite;filter:drop-shadow(0 0 20px rgba(182,255,60,0.5));">👑</div>
    <h2 style="color:#b6ff3c;margin:0 0 5px;font-size:24px;letter-spacing:1px;">DRIP SHOP</h2>
    <div style="color:#8b8b99;font-size:14px;margin-bottom:30px;">Сделано с душой</div>
    <div style="color:#fff;font-size:18px;font-weight:bold;margin-bottom:5px;">Создатель: @iticov</div>
    <div style="color:#8b8b99;font-size:14px;">Помощник: @ro9mbo</div>
</div>

<div id="sub-gate" style="position: fixed; inset: 0; background: #09090b; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;">
    <div style="font-size: 60px; margin-bottom: 20px; animation: pulse 2s infinite;">🔥</div>
    <h1 style="font-size: 28px; color: #b6ff3c; margin: 0 0 10px;">DRIP SHOP</h1>
    <p style="color: #8b8b99; font-size: 14px; margin-bottom: 30px; line-height: 1.5;">Чтобы начать играть, подпишись на наш Telegram-канал!<br>Там промокоды, конкурсы и новости.</p>
    <a href="https://t.me/DRIPSGAMES" target="_blank" style="width: 100%; max-width: 300px; padding: 16px; font-size: 16px; background: #b6ff3c; color: #000; font-weight: bold; border-radius: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px;">
        📢 Подписаться на @DRIPSGAMES
    </a>
    <button id="check-sub" style="width: 100%; max-width: 300px; padding: 16px; font-size: 16px; background: #ff3cac; color: #fff; font-weight: bold; border-radius: 14px; border: none; cursor: pointer;">
        Я подписался ✅
    </button>
</div>

<div id="toast-container"></div>
<div id="float-container"></div>

<audio id="bg-music" loop><source src="music.mp3" type="audio/mpeg"></audio>
<div id="app">
 <header>
  <div id="bal">0 ₽</div>
  <div id="sub">+0 ₽/сек</div>
  <div id="rank">🔥 Уличный дриппер</div>
 </header>
 <main id="main"></main>
 <nav id="nav">
  <button data-t="tap" class="on"><svg viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>Кликер</button>
  <button data-t="shop"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>Шоп</button>
  <button data-t="inv"><svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 16H4V8h16v12z"/></svg>Вещи</button>
  <button data-t="stand"><svg viewBox="0 0 24 24"><path d="M12 2c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 6c-1.1 0-2 .9-2 2v4c0 .55.45 1 1 1h.5v6c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-6h.5c.55 0 1-.45 1-1v-4c0-1.1-.9-2-2-2h-2z"/></svg>Стенд</button>

function openCase(caseId) {
    const c = CASES.find(x => x.id === caseId);
    if (!c) return;
    const pool = ITEMS.filter(i => c.types.includes(i.t));
    const unowned = pool.filter(i => !S.own[i.id]);
    if (unowned.length === 0) { toast('У тебя уже есть все вещи этого кейса!', 'error'); SFX.error(); return; }
    if (S.r < c.price) { toast('Мало кэша!', 'error'); SFX.error(); return; }
    const weights = [60, 30, 8, 2];
    const byRarity = [[],[],[],[]];
    unowned.forEach(i => byRarity[i.r].push(i));
    const flat = [];
    byRarity.forEach((arr, r) => arr.forEach(i => flat.push({ item: i, w: weights[r] })));
    const total = flat.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * total, picked = flat[flat.length - 1].item;
    for (const x of flat) { r -= x.w; if (r <= 0) { picked = x.item; break; } }
    S.r -= c.price;
    S.own[picked.id] = 1;
    save(); head();
    SFX.buy();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    checkAchievements();
    const rarityNames = ['Обычная','Редкая','Эпик','Легенда'];
    const rarityColors = ['#8b8b99','#b36bff','#ffb02e','#ff3cac'];

        <div style="color:var(--mut);font-size:13px;">Ты выбил:</div>
        <div class="case-result-art" style="border-color:${rarityColors[picked.r]};box-shadow:0 0 30px ${rarityColors[picked.r]}80;">${artSpan(picked)}</div>

    `;
    $('case-modal').classList.add('open');
    if (tab === 'cases') view();
}

const DAILY = [5000, 10000, 25000, 50000, 100000, 250000, 1000000];
function checkDaily() {
    const now = Date.now();
    const last = S.lastDaily || 0;
    if (last === 0) return { canClaim: true, streak: 0 };
    const hours = (now - last) / 3600000;
    if (hours >= 48) return { canClaim: true, streak: 0 };
    if (hours >= 20) return { canClaim: true, streak: S.dailyStreak };
    return { canClaim: false, streak: S.dailyStreak };
}
function claimDaily() {
    const { canClaim, streak } = checkDaily();
    if (!canClaim) { toast('Приходи позже!', 'error'); return; }
    const idx = Math.min(streak, 6);
    const reward = DAILY[idx];
    S.r += reward;
    S.lastDaily = Date.now();
    S.dailyStreak = streak + 1;
    save(); head(); view();
    toast(`🎁 +${fmt(reward)} ₽ (день ${streak + 1})`, 'success');
    SFX.buy();
}

// ---------- КРАШ ----------
function crashHTML() {
    const c = CR, running = c.phase === 'run';
    const cls = running ? 'run' : c.phase === 'dead' ? 'dead' : c.phase === 'done' ? 'win' : '';
    const mult = c.phase === 'idle' ? '1.00' : c.mult.toFixed(2);
    const hist = c.hist.map(x => `<span style="color:${x >= 2 ? 'var(--ac)' : '#ff6666'}">${x.toFixed(2)}x</span>`).join('');
    return `<div class="card" style="flex-direction:column;gap:6px;padding:20px 14px;align-items:center;text-align:center">
        <div class="hist">${hist}</div>
        <div style="font-size:40px">${c.phase === 'dead' ? '💥' : '🚀'}</div>
        <div id="cr-mult" class="crash-mult ${cls}">${mult}x</div>
        <div style="color:var(--mut);font-size:13px;font-weight:700;margin-top:4px">${c.msg}</div>
    </div>
    <div class="card" style="flex-direction:column;align-items:stretch;gap:10px">
        <b>Авто-вывод (необязательно)</b>
        <input id="cr-auto" class="g-inp" type="number" step="0.01" inputmode="decimal" placeholder="Например 2.00" value="${c.autoVal}" oninput="CR.autoVal=this.value" ${running ? 'disabled' : ''}>
    </div>
    <button id="cr-btn" class="btn ${running ? 'pk' : 'pri'}" style="width:100%;padding:16px;font-size:16px" onclick="crashAction()">${running ? 'Забрать ' + fmt(c.bet * c.mult) + ' ₽' : 'Играть'}</button>`;
}
function crashAction() {
    ensureAudio();
    if (CR.phase === 'run') { crashCash(); return; }
    const bet = checkBet(); if (!bet) return;
    S.r -= bet; save(); head();
    const r = Math.random();
    CR.crashAt = Math.min(1000, Math.max(1, Math.floor(0.96 / (1 - r) * 100) / 100));
    CR.bet = bet; CR.mult = 1; CR.phase = 'run';
    CR.auto = parseFloat(CR.autoVal) || 0;
    if (CR.auto < 1.01) CR.auto = 0;
    CR.msg = 'Ставка ' + fmt(bet) + ' ₽ — лови момент!';
    CR.t0 = performance.now();
    SFX.equip();
    view();
    CR.raf = requestAnimationFrame(crashTick);
}
function crashTick(now) {
    if (CR.phase !== 'run') return;
    CR.mult = Math.exp(0.1 * (now - CR.t0) / 1000);
    if (CR.mult >= CR.crashAt) { crashEnd(); return; }
    if (CR.auto && CR.mult >= CR.auto) { CR.mult = CR.auto; crashCash(); return; }
    const m = $('cr-mult'), b = $('cr-btn');
    if (m) m.textContent = CR.mult.toFixed(2) + 'x';
    if (b) b.textContent = 'Забрать ' + fmt(CR.bet * CR.mult) + ' ₽';
    CR.raf = requestAnimationFrame(crashTick);
}
function crashPushHist() { CR.hist.unshift(CR.crashAt); if (CR.hist.length > 12) CR.hist.pop(); }
function crashCash() {
    if (CR.phase !== 'run') return;
    cancelAnimationFrame(CR.raf);
    const win = Math.floor(CR.bet * CR.mult);
    S.r += win; CR.phase = 'done';
    CR.msg = `Забрано на x${CR.mult.toFixed(2)}: +${fmt(win - CR.bet)} ₽ (крах был бы на x${CR.crashAt.toFixed(2)})`;
    crashPushHist(); save(); head();
    toast(`🚀 Выигрыш +${fmt(win - CR.bet)} ₽`, 'success'); SFX.achiev();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    checkAchievements();
    if (tab === 'games') view();
}
function crashEnd() {
    cancelAnimationFrame(CR.raf);
    CR.mult = CR.crashAt; CR.phase = 'dead';
    CR.msg = `Крах на x${CR.crashAt.toFixed(2)}: −${fmt(CR.bet)} ₽`;
    crashPushHist(); save(); head();
    toast('💥 Крах! −' + fmt(CR.bet) + ' ₽', 'error'); SFX.error();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    if (tab === 'games') view();
}

function minesHTML() {
    const M = MN;
    const opts = [1, 3, 5, 10, 20].map(n => `<button class="btn ${M.mines === n ? 'pri' : ''}" onclick="setMines(${n})" ${M.active ? 'disabled' : ''}>${n}</button>`).join('');
    let g = '<div class="mines-grid">';
    for (let i = 0; i < 25; i++) {
        let cls = 'mtile', c = '';
        if (M.open[i]) { cls += M.grid[i] ? ' mine' : ' safe'; c = M.grid[i] ? '💥' : '💎'; }
        else if (M.over) { cls += ' ghost'; if (M.grid[i]) { cls += ' mine'; c = '💣'; } else c = '💎'; }
        g += `<div class="${cls}" onclick="mineClick(${i})">${c}</div>`;
    }
    g += '</div>';
    const curMult = M.hits ? mineMult(M.hits, M.mines) : 1;
    let info = M.msg;
    if (M.active) info = `Открыто: ${M.hits} · x${curMult.toFixed(2)}` + (M.hits < 25 - M.mines ? ` · далее x${mineMult(M.hits + 1, M.mines).toFixed(2)}` : '');
    let btn;
    if (M.active) btn = `<button class="btn pk" style="width:100%;padding:16px;font-size:16px" onclick="mineCash()" ${M.hits ? '' : 'disabled'}>${M.hits ? 'Забрать ' + fmt(M.bet * curMult) + ' ₽' : 'Открой клетку'}</button>`;
    else btn = `<button class="btn pri" style="width:100%;padding:16px;font-size:16px" onclick="mineStart()">Начать игру</button>`;
    return `<div class="card" style="flex-direction:column;align-items:stretch;gap:10px"><b>Количество мин</b><div class="g-row">${opts}</div></div>
    <div style="text-align:center;color:var(--mut);font-size:13px;font-weight:700;margin:4px 0 10px">${info}</div>${g}${btn}`;
}
function mineStart() {
    ensureAudio();
    const bet = checkBet(); if (!bet) return;
    S.r -= bet; save(); head();
    const arr = Array(25).fill(false);
    const idx = [...Array(25).keys()];
    for (let i = 24; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    for (let i = 0; i < MN.mines; i++) arr[idx[i]] = true;
    MN.grid = arr; MN.open = Array(25).fill(false); MN.hits = 0; MN.bet = bet; MN.active = true; MN.over = false;
    SFX.equip(); view();
}
function mineClick(i) {
    if (!MN.active || MN.open[i]) return;
    MN.open[i] = true;
    if (MN.grid[i]) {
        MN.active = false; MN.over = true;
        MN.msg = `💥 Мина! −${fmt(MN.bet)} ₽`;
        toast('💥 Мина! −' + fmt(MN.bet) + ' ₽', 'error'); SFX.error();
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        view();
    } else {
        MN.hits++; SFX.tap();
        if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        if (MN.hits >= 25 - MN.mines) mineCash(); else view();
    }
}
function mineCash() {
    if (!MN.active || !MN.hits) return;
    const mult = mineMult(MN.hits, MN.mines);
    const win = Math.floor(MN.bet * mult);
    S.r += win; MN.active = false; MN.over = true;
    MN.msg = `✅ Забрано x${mult.toFixed(2)}: +${fmt(win - MN.bet)} ₽`;
    save(); head();
    toast(`💎 Выигрыш +${fmt(win - MN.bet)} ₽`, 'success'); SFX.achiev();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    checkAchievements(); view();
}

// ---------- 🎡 КОЛЕСО ----------
function wheelHTML() {
    const w = WH;
    const segs = WHEEL_SEGMENTS.map(s => `<span style="display:inline-block;padding:3px 8px;margin:2px;border-radius:6px;background:${s.color}22;color:${s.color};font-weight:800;font-size:12px;">${s.mult}x</span>`).join('');
    const color = w.spinning ? 'var(--ac)' : (w.bet && w.mult === 0 ? '#ff4444' : w.mult > 1 ? 'var(--ac)' : 'var(--fg)');
    return `<div class="card" style="flex-direction:column;gap:10px;padding:20px 14px;align-items:center;text-align:center">
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:4px;">${segs}</div>
        <div id="wh-display" style="font-size:56px;font-weight:900;color:${color};margin:15px 0;">${w.spinning ? '🎡' : (w.bet ? w.mult.toFixed(1) + 'x' : '🎡')}</div>
        <div style="color:var(--mut);font-size:13px;font-weight:700;">${w.msg}</div>
    </div>
    <button class="btn ${w.spinning?'pk':'pri'}" style="width:100%;padding:16px;font-size:16px" onclick="wheelSpin()" ${w.spinning?'disabled':''}>${w.spinning?'Крутится...':'Крутить за '+fmt(GBET)+' ₽'}</button>`;
}
function wheelSpin() {
    if (WH.spinning) return;
    const bet = checkBet(); if (!bet) return;
    ensureAudio();
    S.r -= bet; save(); head();
    WH.spinning = true; WH.bet = bet; WH.mult = 0; WH.msg = 'Крутится...';
    view();
    const total = WHEEL_SEGMENTS.reduce((s, x) => s + x.weight, 0);
    let r = Math.random() * total, picked = WHEEL_SEGMENTS[WHEEL_SEGMENTS.length - 1];
    for (const s of WHEEL_SEGMENTS) { r -= s.weight; if (r <= 0) { picked = s; break; } }
    let tick = 0;
    const interval = setInterval(() => {
        tick++;
        const disp = $('wh-display');
        if (disp && tick < 18) disp.textContent = WHEEL_SEGMENTS[Math.floor(Math.random() * WHEEL_SEGMENTS.length)].mult + 'x';
        if (tick >= 20) {
            clearInterval(interval);
            WH.mult = picked.mult; WH.spinning = false;
            const win = Math.floor(bet * picked.mult);
            S.r += win;
            WH.msg = picked.mult > 0 ? `Выпало ${picked.mult}x: ${win - bet >= 0 ? '+' : ''}${fmt(win - bet)} ₽` : `Выпало 0x: −${fmt(bet)} ₽`;
            save(); head();
            if (picked.mult > 1) { toast(`🎡 +${fmt(win - bet)} ₽`, 'success'); SFX.achiev(); }
            else if (picked.mult === 0) { toast(`🎡 −${fmt(bet)} ₽`, 'error'); SFX.error(); }
            else { toast(`🎡 ${fmt(win - bet)} ₽`, 'info'); }
            checkAchievements();
            if (tab === 'games') view();
        }
    }, 80);
}

// ---------- 🎲 КОСТИ ----------
function diceHTML() {
    const d = DC;
    const winNums = d.mode === 'over' ? (100 - d.threshold) : d.threshold;
    const winMult = winNums > 0 ? Math.min(100, 0.98 * 100 / winNums) : 2;
    return `<div class="card" style="flex-direction:column;gap:10px">
        <b>Порог: ${d.threshold} (выигрыш ×${winMult.toFixed(2)})</b>
        <input type="range" min="2" max="98" value="${d.threshold}" oninput="DC.threshold=+this.value; view();" ${d.rolling?'disabled':''}>
        <div class="g-row">
            <button class="btn ${d.mode==='over'?'pri':''}" onclick="DC.mode='over'; view();" ${d.rolling?'disabled':''}>Больше ${d.threshold}</button>
            <button class="btn ${d.mode==='under'?'pri':''}" onclick="DC.mode='under'; view();" ${d.rolling?'disabled':''}>Меньше ${d.threshold}</button>
        </div>
    </div>
    <div class="card" style="flex-direction:column;gap:6px;padding:20px 14px;align-items:center;text-align:center">
        <div style="font-size:48px">🎲</div>
        <div id="dc-display" style="font-size:56px;font-weight:900;color:${d.rolling?'var(--ac)':d.roll>0?'var(--ac2)':'var(--fg)'}">${d.rolling ? '?' : (d.roll || '?')}</div>
        <div style="color:var(--mut);font-size:13px;font-weight:700">${d.msg}</div>
    </div>
    <button class="btn ${d.rolling?'pk':'pri'}" style="width:100%;padding:16px;font-size:16px" onclick="diceRoll()" ${d.rolling?'disabled':''}>${d.rolling?'Бросаем...':'Бросить за '+fmt(GBET)+' ₽'}</button>`;
}
function diceRoll() {
    if (DC.rolling) return;
    const bet = checkBet(); if (!bet) return;
    ensureAudio();
    S.r -= bet; save(); head();
    DC.rolling = true; DC.roll = 0; DC.msg = 'Бросаем...';
    view();
    let tick = 0;
    const interval = setInterval(() => {
        tick++;
        const disp = $('dc-display');
        if (disp && tick < 18) disp.textContent = Math.floor(Math.random() * 100) + 1;
        if (tick >= 20) {
            clearInterval(interval);
            const result = Math.floor(Math.random() * 100) + 1;
            DC.roll = result; DC.rolling = false;
            const win = DC.mode === 'over' ? result > DC.threshold : result < DC.threshold;
            const winNums = DC.mode === 'over' ? (100 - DC.threshold) : DC.threshold;
            const winMult = winNums > 0 ? 0.98 * 100 / winNums : 2;
            if (win) {
                const w = Math.floor(bet * winMult);
                S.r += w;
                DC.msg = `Выпало ${result} → +${fmt(w - bet)} ₽ (×${winMult.toFixed(2)})`;
                toast(`🎲 +${fmt(w - bet)} ₽`, 'success'); SFX.achiev();
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                DC.msg = `Выпало ${result} → −${fmt(bet)} ₽`;
                toast(`🎲 −${fmt(bet)} ₽`, 'error'); SFX.error();
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
            save(); head(); checkAchievements();
            if (tab === 'games') view();
        }
    }, 80);
}

// ---------- 🪙 МОНЕТКА ----------
function coinHTML() {
    const c = CF;
    return `<div class="card" style="flex-direction:column;gap:10px">
        <div class="g-row">
            <button class="btn ${c.choice==='heads'?'pri':''}" onclick="CF.choice='heads'; view();" ${c.flipping?'disabled':''}>🦅 Орёл ×1.95</button>
            <button class="btn ${c.choice==='tails'?'pri':''}" onclick="CF.choice='tails'; view();" ${c.flipping?'disabled':''}>👑 Решка ×1.95</button>
        </div>
    </div>
    <div class="card" style="flex-direction:column;gap:6px;padding:20px 14px;align-items:center;text-align:center">
        <div id="cf-display" style="font-size:70px">${c.flipping?'🪙':(c.result || '🪙')}</div>
        <div style="color:var(--mut);font-size:13px;font-weight:700">${c.msg}</div>
    </div>
    <button class="btn ${c.flipping?'pk':'pri'}" style="width:100%;padding:16px;font-size:16px" onclick="coinFlip()" ${c.flipping?'disabled':''}>${c.flipping?'Крутим...':'Бросить за '+fmt(GBET)+' ₽'}</button>`;
}
function coinFlip() {
    if (CF.flipping) return;
    const bet = checkBet(); if (!bet) return;
    ensureAudio();
    S.r -= bet; save(); head();
    CF.flipping = true; CF.result = ''; CF.msg = 'Крутим...';
    view();
    let tick = 0;
    const interval = setInterval(() => {
        tick++;
        const disp = $('cf-display');
        if (disp && tick < 14) disp.textContent = Math.random() < 0.5 ? '🦅' : '👑';
        if (tick >= 15) {
            clearInterval(interval);
            const isHeads = Math.random() < 0.5;
            CF.result = isHeads ? '🦅' : '👑';
            CF.flipping = false;
            const win = (CF.choice === 'heads' && isHeads) || (CF.choice === 'tails' && !isHeads);
            if (win) {
                const w = Math.floor(bet * 1.95);
                S.r += w;
                CF.msg = `Выпало ${CF.result} → +${fmt(w - bet)} ₽`;
                toast(`🪙 +${fmt(w - bet)} ₽`, 'success'); SFX.achiev();
                                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                CF.msg = `Выпало ${CF.result} → −${fmt(bet)} ₽`;
                toast(`🪙 −${fmt(bet)} ₽`, 'error'); SFX.error();
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
            save(); head(); checkAchievements();
            if (tab === 'games') view();
        }
    }, 100);
}

// ---------- 🎰 СЛОТЫ ----------
function slotsHTML() {
    const s = SL;
    const reels = s.reels.join(' ');
    return `<div class="card" style="flex-direction:column;gap:10px;padding:20px 14px;align-items:center;text-align:center">
        <div style="display:flex;gap:8px;justify-content:center;font-size:12px;color:var(--mut);font-weight:800;flex-wrap:wrap;">
            ${SL_SYMBOLS.map(sym=>`<span style="padding:3px 8px;background:rgba(0,0,0,.3);border-radius:6px;">${sym} ×${SL_PAYOUTS[sym]}</span>`).join('')}
        </div>
        <div id="sl-reels" style="font-size:48px;letter-spacing:8px;margin:15px 0;">${reels}</div>
        <div style="color:var(--mut);font-size:13px;font-weight:700">${s.msg}</div>
    </div>
    <button class="btn ${s.spinning?'pk':'pri'}" style="width:100%;padding:16px;font-size:16px" onclick="slotSpin()" ${s.spinning?'disabled':''}>${s.spinning?'Крутим...':'Крутить за '+fmt(GBET)+' ₽'}</button>`;
}
function slotSpin() {
    if (SL.spinning) return;
    const bet = checkBet(); if (!bet) return;
    ensureAudio();
    S.r -= bet; save(); head();
    SL.spinning = true; SL.msg = 'Крутим...';
    view();
    let tick = 0, final = null;
    const interval = setInterval(() => {
        tick++;
        const r1 = SL_SYMBOLS[Math.floor(Math.random() * SL_SYMBOLS.length)];
        const r2 = SL_SYMBOLS[Math.floor(Math.random() * SL_SYMBOLS.length)];
        const r3 = SL_SYMBOLS[Math.floor(Math.random() * SL_SYMBOLS.length)];
        final = [r1, r2, r3];
        const el = $('sl-reels');
        if (el) el.textContent = final.join(' ');
        if (tick >= 20) {
            clearInterval(interval);
            SL.reels = final; SL.spinning = false;
            handleSlotResult(bet, final[0], final[1], final[2]);
        }
    }, 70);
}
function handleSlotResult(bet, r1, r2, r3) {
    const allSame = r1 === r2 && r2 === r3;
    const twoSame = !allSame && (r1 === r2 || r2 === r3 || r1 === r3);
    if (allSame) {
        const pay = SL_PAYOUTS[r1] || 5;
        const win = Math.floor(bet * pay);
        S.r += win;
        SL.msg = `🎉 Три ${r1}: +${fmt(win - bet)} ₽ (×${pay})`;
        toast(`🎰 ДЖЕКПОТ +${fmt(win - bet)} ₽`, 'success'); SFX.achiev();
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else if (twoSame) {
        S.r += bet;
        SL.msg = `Два совпадения — ставка возвращена`;
        toast(`🎰 Ставка возвращена`, 'info');
    } else {
        SL.msg = `Не повезло: −${fmt(bet)} ₽`;
        toast(`🎰 −${fmt(bet)} ₽`, 'error'); SFX.error();
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }
    save(); head(); checkAchievements();
    if (tab === 'games') view();
}

// ===== НАВИГАЦИЯ =====
$('nav').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    tab = b.dataset.t;
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
    view();
});

// ===== ЦИКЛЫ =====
setInterval(() => {
    if (S.autoLvl > 0) { S.r += getAutoValue(); head(); }
    S.timePlayed++;
}, 1000);
setInterval(() => { save(); checkAchievements(); }, 5000);
setInterval(() => { syncWithServer(); }, 30000);

document.addEventListener('visibilitychange', () => {
    if (document.hidden) { save(); syncWithServer(true); }
});

// ===== OFFLINE INCOME =====
(function calcOffline() {
    if (!S.lastSeen) return;
    const elapsedSec = Math.min((Date.now() - S.lastSeen) / 1000, 8 * 3600);
    if (elapsedSec > 60 && S.autoLvl > 0) {
        const offline = Math.floor(elapsedSec * getAutoValue() * 0.5);
        if (offline > 0) {
            S.r += offline;
            save();
            setTimeout(() => { toast(`💤 Пока тебя не было: +${fmt(offline)} ₽`, 'success'); }, 1500);
        }
    }
})();

// ===== SUBSCRIPTION GATE =====
document.getElementById('check-sub').onclick = function() {
    const btn = this;
    btn.innerText = 'Проверяем...';
    btn.disabled = true;
    btn.style.opacity = '0.7';
    setTimeout(() => {
        localStorage.setItem('subscribed_v2', 'true');
        document.getElementById('sub-gate').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }, 1500);
};

// ===== SPLASH =====
setTimeout(() => {
    const splash = document.getElementById('splash-screen');
    if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => {
            splash.style.display = 'none';
            if (localStorage.getItem('subscribed_v2') === 'true') {
                document.getElementById('app').style.display = 'flex';
            }
        }, 500);
    }
}, 2500);

if (localStorage.getItem('subscribed_v2') === 'true') {
    document.getElementById('sub-gate').style.display = 'none';
} else {
    document.getElementById('sub-gate').style.display = 'flex';
}

// ===== BOOT =====
syncWithServer(true);
loadTopFromServer();
head(); view();
</script>
