<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DRIP FITS: GLOBAL 26</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:rgba(30,30,40,0.85);--card-border:rgba(255,255,255,0.1);--fg:#f4f4f6;--mut:#8b8b99;--ac:#b6ff3c;--ac2:#ff3cac;--blur:blur(12px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;z-index:10}
header{padding:20px 16px 10px;text-align:center;position:relative;z-index:15;flex:none}
#bal{font-size:38px;font-weight:900;color:var(--ac);letter-spacing:.5px;text-shadow:0 0 15px rgba(182,255,60,.3)}
#sub{font-size:12px;color:var(--mut);margin-top:4px;font-weight:bold;}
#rank{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--card-border);backdrop-filter:var(--blur);font-size:13px;font-weight:700;color:var(--ac2)}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 14px 80px;position:relative;z-index:10}
main::-webkit-scrollbar{display:none}

nav{display:flex;gap:4px;padding:10px 6px;background:rgba(20,20,25,0.95);backdrop-filter:var(--blur);border-top:1px solid var(--card-border);justify-content:space-between;position:absolute;bottom:0;left:0;right:0;z-index:20;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;min-width:0;padding:8px 0;border:0;border-radius:14px;background:transparent;color:var(--mut);font-weight:700;font-size:9px;transition:.2s;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
nav button.on{background:var(--card);border:1px solid var(--card-border);color:var(--ac);box-shadow:0 0 15px rgba(182,255,60,0.1)}
nav svg{width:18px;height:18px;fill:currentColor;}

.card{background:var(--card);backdrop-filter:var(--blur);border:1px solid var(--card-border);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:.2s}
.ic{width:52px;height:52px;border-radius:14px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
.card .t{flex:1;min-width:0}.card b{display:block;font-size:15px;line-height:1.2;margin-bottom:4px;}.card small{color:var(--mut);font-size:12px}
.btn{padding:12px 16px;border:0;border-radius:14px;background:rgba(255,255,255,0.08);color:var(--fg);font-weight:700;font-size:14px;cursor:pointer;transition:.2s;border:1px solid rgba(255,255,255,0.05);white-space:nowrap;}
.btn.pri{background:var(--ac);color:#10130a;box-shadow:0 0 20px rgba(182,255,60,0.3);border:0}
.btn.pk{background:var(--ac2);color:#fff;box-shadow:0 0 20px rgba(255,60,172,0.3);border:0}
.btn:disabled{opacity:0.5;filter:grayscale(1);cursor:not-allowed;}

#tapw{display:flex;flex-direction:column;align-items:center;padding-top:10px}
#tap{width:200px;height:200px;border-radius:50%;border:4px solid rgba(255,255,255,0.1);background:radial-gradient(circle at 35% 30%,#d6ff7a,var(--ac) 55%,#6aa010);color:#10130a;box-shadow:0 0 60px rgba(182,255,60,.4);transition:transform .06s;position:relative;touch-action:manipulation;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#tap:active{transform:scale(.92)}
#tap svg{width:90px;height:90px;filter:drop-shadow(0 10px 10px rgba(0,0,0,0.3));}
.tap-val{font-size:24px;font-weight:900;margin-top:15px;color:var(--ac);text-align:center;}

.upgrades {width:100%;margin-top:20px;}
.up-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.up-card-info b{font-size:16px;display:block;margin-bottom:4px;}
.up-card-info small{color:var(--mut);font-size:12px;}

/* СТЕНД */
.stand-container {position: relative;width: 100%;height: 440px;background: radial-gradient(circle at 50% 30%, #1a1a24 0%, #09090b 80%);border-radius: 24px;border: 1px solid var(--card-border);margin-bottom: 15px;display: flex;justify-content: center;align-items: flex-end;overflow: hidden;box-shadow: inset 0 0 50px rgba(0,0,0,0.8);}
.stand-spotlight {position: absolute;top: 10%;width: 180px;height: 180px;background: var(--ac);filter: blur(90px);opacity: 0.15;border-radius: 50%;}
.stand-podium {position: absolute;bottom: 15px;width: 220px;height: 30px;background: linear-gradient(to bottom, #222, #111);border-radius: 50%;border-bottom: 2px solid #333;box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 20px rgba(182,255,60,0.15);}

.mannequin-wrapper {position: relative;width: 160px;height: 340px;margin-bottom: 20px;z-index: 2;}
.mannequin-base {width: 100%;height: 100%;display: block;}

.eq-item {position: absolute;width: 100px;height: 100px;transform-origin: center center;filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));pointer-events: none;}
.eq-item svg {width: 100%;height: 100%;}

.slot-btn{background:var(--card);border:1px solid var(--card-border);padding:10px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;cursor:pointer;transition:0.2s;}
.slot-btn:active {transform: scale(0.98);}
.slot-btn b{font-size:14px;}
.slot-btn small{color:var(--mut);font-size:12px;margin-left:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}

/* ФИЛЬТРЫ И ПОИСК */
.shop-controls {display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;}
.shop-search {width: 100%; padding: 14px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--card-border); color: var(--fg); font-size: 15px; outline: none; transition: 0.2s;}
.shop-search:focus {border-color: var(--ac); box-shadow: 0 0 15px rgba(182,255,60,0.2);}
.shop-filters {display: flex;gap: 8px;overflow-x: auto;padding-bottom: 5px;scrollbar-width: none;}
.shop-filters::-webkit-scrollbar {display: none;}
.filter-btn {padding: 8px 16px;border-radius: 20px;background: var(--card);border: 1px solid var(--card-border);color: var(--mut);font-size: 13px;font-weight: 700;white-space: nowrap;cursor: pointer;transition: 0.2s;}
.filter-btn.on {background: var(--ac);color: #10130a;border-color: var(--ac);}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);z-index:100;display:none;flex-direction:column;justify-content:flex-end;}
.modal.open{display:flex;}
.modal-content{background:var(--bg);border-top-left-radius:24px;border-top-right-radius:24px;max-height:75vh;overflow-y:auto;padding:20px;border-top:1px solid var(--card-border);animation: slideUp 0.3s ease;}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:2;}
.modal-header h3{margin:0;}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:0.2s;}
.cell:active{transform:scale(0.95);}
.cell.own{border-color:rgba(255,255,255,0.1);}
.cell .artw{width:60px;height:60px;}
.artw{display:block;width:100%;height:100%;}
.artw svg{width:100%;height:100%;display:block;}

input[type=range] {-webkit-appearance: none;width: 100%;height: 6px;background: rgba(255,255,255,0.1);border-radius: 3px;outline: none;}
input[type=range]::-webkit-slider-thumb {-webkit-appearance: none;width: 22px;height: 22px;background: var(--ac);border-radius: 50%;cursor: pointer;box-shadow: 0 0 10px rgba(182,255,60,0.5);border: 2px solid #10130a;}
.promo-inp {flex: 1;padding: 12px;border-radius: 10px;border: 1px solid var(--card-border);background: rgba(0,0,0,0.5);color: var(--fg);font-size: 14px;outline: none;text-transform: uppercase;font-weight: 700;letter-spacing: 1px;}
.promo-inp:focus {border-color: var(--ac);}

.contact-link {display:flex; justify-content:space-between; align-items:center; padding:12px 0; text-decoration:none; color:var(--fg); border-bottom:1px solid rgba(255,255,255,0.05); transition:0.2s;}
.contact-link:last-child {border-bottom:none;}
.contact-link:active {opacity:0.7;}
.contact-link span {font-weight:700; font-size:14px;}
.contact-link small {color:var(--mut); font-size:12px;}
.tg-username {color:var(--ac); font-weight:900;}
</style>
</head>

 </nav>
</div>

<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString('ru-RU').replace(/\u00a0/g,' ');

// --- МУЗЫКА (АВТОЗАПУСК ПРИ ЛЮБОМ ТАПЕ) ---
const bgMusic = document.getElementById('bg-music');
let musicVolume = parseInt(localStorage.getItem('musicVol') || '40');
bgMusic.volume = musicVolume / 100;

function startMusic() {
    // Если музыка на паузе, пробуем включить
    if (bgMusic.paused) {
        bgMusic.play().catch(e => {
            console.log("Ждем взаимодействия для звука");
        });
    }
}

// Вешаем на все возможные события (тап, клик, скролл) на уровне всего документа
document.addEventListener('pointerdown', startMusic);
document.addEventListener('touchstart', startMusic, {passive: true});
document.addEventListener('click', startMusic);

function setVolume(val) {
    musicVolume = parseInt(val);
    bgMusic.volume = musicVolume / 100;
    localStorage.setItem('musicVol', musicVolume);
    const lbl = document.getElementById('vol-label');
    if (lbl) lbl.textContent = musicVolume + '%';
}

// --- ГЕНЕРАЦИЯ ВЕЩЕЙ ---
const ART={ cap:"<path d='M20 58 Q22 28 50 28 Q78 28 80 58Z' fill='#3a7bd5'/><path d='M62 56 Q92 54 92 66 L60 66Z' fill='#2a5aa0'/><rect x='20' y='56' width='62' height='5' fill='#1f3f73'/><circle cx='50' cy='28' r='3' fill='#fff'/>", cargo:"<path d='M30 15H70L76 85H55L50 40L45 85H24Z' fill='#6b705c'/><rect x='30' y='15' width='40' height='7' fill='#4d513f'/><rect x='28' y='50' width='14' height='14' fill='#555a47'/><rect x='58' y='50' width='14' height='14' fill='#555a47'/>", hood:"<path d='M34 20Q50 8 66 20L90 40L80 52L72 46V86H28V46L20 52L10 40Z' fill='#5a5a64'/><path d='M38 20Q50 34 62 20Q50 12 38 20Z' fill='#222'/><rect x='36' y='62' width='28' height='16' fill='#46464e'/><path d='M45 32V50M55 32V50' stroke='#ddd' stroke-width='2'/>", bag:"<path d='M18 40Q50 0 82 40' stroke='#444' stroke-width='5' fill='none'/><rect x='22' y='38' width='56' height='42' rx='6' fill='#222'/><path d='M22 50H78L50 62Z' fill='#333'/><rect x='46' y='58' width='8' height='8' rx='2' fill='#b6ff3c'/>", sneak:"<path d='M12 62V45Q30 44 38 34L50 44Q70 46 90 60V72H12Z' fill='#eee'/><rect x='12' y='68' width='78' height='9' rx='3' fill='#b6ff3c'/><path d='M38 34L50 44M44 40L52 36M50 44L58 40' stroke='#999' stroke-width='2' fill='none'/><path d='M12 62Q40 58 90 62' stroke='#ff3cac' stroke-width='3' fill='none'/>", chain:"<path d='M22 20Q50 90 78 20' stroke='#ffd34d' stroke-width='6' stroke-dasharray='9 3' fill='none' stroke-linecap='round'/><rect x='40' y='52' width='20' height='20' rx='4' fill='#ffd34d' transform='rotate(45 50 62)'/><circle cx='50' cy='62' r='4' fill='#fff'/>", shades:"<rect x='12' y='38' width='34' height='22' rx='8' fill='#111'/><rect x='54' y='38' width='34' height='22' rx='8' fill='#111'/><rect x='44' y='42' width='12' height='5' fill='#111'/><path d='M18 42L30 56M60 42L72 56' stroke='#666' stroke-width='3'/><path d='M12 42L4 38M88 42L96 38' stroke='#111' stroke-width='4'/>", mask:"<path d='M50 12Q80 12 80 48Q80 80 66 90H34Q20 80 20 48Q20 12 50 12Z' fill='#202024'/><rect function hs(n){let x=((n+1)*2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;return x>>>0}

let ITEMS=[];
(function(){
    const MU=[1,2.2,5,12],EN={m:'ый',f:'ая',n:'ое',p:'ые'};let n=0;
    for(const t of TY){
        for(const c of COL){
            for(const s of STY){
                const W=t[0][0]==='w',h=hs(n);
                const bi=W?20+(h>>>12)%10:((h>>>12)%30);
                const B=bi>=0?BR[bi]:null;
                const q=h%100+(B?B[3]:-8),r=q<58?0:q<84?1:q<96?2:3;
                let k=(h>>>16)%15;
                if(COL[k][1]===c[1])k=(k+5)%15;
                ITEMS.push({
                    id:'g'+n,g:1,t:t[0],c1:c[1],c2:COL[k][1],pt:(h%7<2)?0:1+(h>>>5)%6,bi,
                    fl:(h>>>9)&1,rt:((h>>>10)%13)-6,sc:.92+((h>>>14)%14)/100,r,
                    p:Math.round(t[3]*MU[r]*(B?B[2]:.8)*(.8+((h>>>8)%40)/100)/10)*10,
                    n:t[1]+(B?' '+B[0]:'')+' «'+s+'» '+c[0]+EN[t[2]]
                });
                n++;
            }
        }
    }
})();

function artSpan(i, noBg = false) {
    const id='a'+i.id, fx=i.fl?-1:1, pt=(['chain','shades'].includes(i.t)||i.t[0]==='w')?0:i.pt;
    const D={ 1:"<pattern id='"+id+"p' width='12' height='12' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='12' height='12' fill='"+i.c1+"'/><rect width='5' height='12' fill='"+i.c2+"'/></pattern>", 2:"<pattern id='"+id+"p' width='14' height='14' patternUnits='userSpaceOnUse'><rect width='14' height='14' fill='"+i.c1+"'/><circle cx='7' cy='7' r='3' fill='"+i.c2+"'/></pattern>", 3:"<pattern id='"+id+"p' width='20' height='20' patternUnits='userSpaceOnUse'><rect width='20' height='20' fill='"+i.c1+"'/><rect width='10' height='10' fill='"+i.c2+"'/><rect x='10' y='10' width='10' height='10' fill='"+i.c2+"'/></pattern>", 4:"<pattern id='"+id+"p' width='32' height='32' patternUnits='userSpaceOnUse'><rect width='32' height='32' fill='"+i.c1+"'/><ellipse cx='8' cy='9' rx='9' ry='5' fill='"+i.c2+"' opacity='.75'/><ellipse cx='23' cy='22' rx='8' ry='6' fill='"+i.c2+"' opacity='.75'/></pattern>", 5:"<linearGradient id='"+id+"p' x1='0' x2='1' y1='0' y2='0'><stop offset='.5' stop-color='"+i.c1+"'/><stop offset='.5' stop-color='"+i.c2+"'/></linearGradient>", 6:"<linearGradient id='"+id+"p' x1='0' x2='0' y1='0' y2='1'><stop offset='0' stop-color='"+i.c1+"'/><stop offset='1' stop-color='"+i.c2+"'/></linearGradient>" };
    let art=ART[i.t].split(MAIN[i.t]).join(pt?"url(#"+id+"p)":i.c1);
    if(ACC[i.t])art=art.split(ACC[i.t]).join(i.c2);
    const bg = noBg ? 'transparent' : ['#2a2a34','#16304a','#2e1f4a','#4a3410'][i.r];
    const rc = noBg ? '' : ['','','#b36bff','#ffb02e'][i.r];
    const bp=BP[i.t],bd=i.bi!==undefined&&bp?"<circle cx='"+bp[0]+"' cy='"+bp[1]+"' r='8' fill='#111' stroke='#fff' stroke-width='1.2'/><text transform='translate("+bp[0]+" "+(bp[1]+3)+") scale("+fx+" 1)' text-anchor='middle' font-size='"+(BR[i.bi][1].length>1?7:9)+"' font-weight='900' fill='#fff' font-family='Arial,sans-serif'>"+BR[i.bi][1]+"</text>":'';
    return `<span class='artw'><svg viewBox='0 0 100 100'><defs>${D[pt]||''}</defs>${noBg?'':`<rect width='100' height='100' fill='${bg}'/>`}<g transform='translate(50 50) rotate(${i.rt}) scale(${fx*i.sc} ${i.sc}) translate(-50 -50)'>${art}${bd}</g>${rc?`<rect x='1.5' y='1.5' width='97' height='97' rx='8' fill='none' stroke='${rc}' stroke-width='3'/>`:''}</svg></span>`;
}

function applyPromo() {
    const input = document.getElementById('promo-input');
    if (!input) return;
    const code = input.value.trim().toUpperCase();
    if (!code) return;
    if (!S.promos) S.promos = {};
    if (S.promos[code]) { alert('Этот промокод уже активирован!'); return; }
    const reward = PROMOS[code];
    if (!reward) { alert('Неверный промокод ❌'); if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error'); return; }
    S.r += reward.r; S.promos[code] = true; save(); head(); view();
    alert(`✅ Промокод ${code} активирован!\n+${fmt(reward.r)} ₽`);
    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function resetGame() {
    if (confirm('Точно сбросить весь прогресс? Это нельзя отменить.')) {
        localStorage.removeItem('drip9');
        S = { r: 0, own: {}, eq: {}, tapLvl: 1, autoLvl: 0, promos: {} };
        save(); head(); view();
    }
}

function setShopFilter(f) {
    shopFilter = f;
    shopLimit = 20;
    view();

function onSearchInput(val) {
    searchQuery = val;
    shopLimit = 20;
    // Обновляем только список товаров, без перерисовки всей страницы (чтобы клавиатура не закрывалась)
    const displayItems = getFilteredItems();
    const container = document.getElementById('shop-items');
    if (container) {
        container.innerHTML = renderShopItems(displayItems);
    }
}

function getFilteredItems() {
    let displayItems = ITEMS;
    if (shopFilter !== 'all') {
        const allowed = CATEGORIES[shopFilter].types;
        displayItems = displayItems.filter(i => allowed.includes(i.t));
    }
    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        displayItems = displayItems.filter(i => i.n.toLowerCase().includes(q));
    }
    return displayItems;
}

function renderShopItems(displayItems) {
    if (displayItems.length === 0) return '<p style="text-align:center;color:var(--mut);margin-top:20px;">Ничего не найдено</p>';
    
    let html = displayItems.slice(0, shopLimit).map(i=>{
        const o=S.own[i.id];
        return `<div class="card">
            <div class="ic">${artSpan(i)}</div>
            <div class="t"><b>${i.n}</b><small style="color:var(--ac2)">${['Обычная','Редкая','Эпик','Легенда'][i.r]}</small><br><small>${fmt(i.p)} ₽</small></div>
            <button class="btn ${o?'':'pri'}" onclick="buy('${i.id}')" ${o?'disabled':''}>${o?'Есть':'Купить'}</button>
        </div>`;
    }).join('');

    if(shopLimit < displayItems.length) {
        html += `<button class="btn" onclick="shopLimit += 20; view();" style="width:100%; margin-top:10px;">Показать еще (${shopLimit} из ${displayItems.length})</button>`;
    }
    return html;
}

            </div>
            <input type="range" id="vol-slider" min="0" max="100" value="${musicVolume}" oninput="setVolume(this.value)">
        </div>
    </div>
    
    <div class="card" style="flex-direction:column; align-items:stretch; gap:10px;">
        <div style="display:flex; justify-content:space-between;">
            <b>🎁 Промокод</b>
            <small style="color:var(--mut)">Использовано: ${usedCount}/6</small>
        </div>
        <div style="display:flex; gap:8px;">
            <input type="text" id="promo-input" placeholder="Введи код..." class="promo-inp" autocomplete="off">
            <button class="btn pri" onclick="applyPromo()">ОК</button>
        </div>
    </div>
    
    <div class="card" style="flex-direction:column; align-items:stretch; gap:5px; padding:16px 18px;">
        <b style="margin-bottom:8px;">👨‍💻 Создатели</b>
        <a href="https://t.me/iticov" target="_blank" class="contact-link">
            <span>Создатель игры</span>
            <small class="tg-username">@iticov</small>
        </a>
        <a href="https://t.me/ro9mbo" target="_blank" class="contact-link">
            <span>Помощник создателя</span>
            <small class="tg-username">@ro9mbo</small>
        </a>
    </div>
    
    <button class="btn" onclick="resetGame()" style="width:100%; background:rgba(255,60,60,0.15); border-color:rgba(255,60,60,0.4); color:#ff6666;">🗑 Сбросить прогресс</button>`;
 }
 m.innerHTML=h;
 
 // Восстанавливаем скролл (только если не в поиске)
 if (tab !== 'shop' || !searchQuery) {
    $('main').scrollTop = scrollPos; 
 }
 
 if(tab==='tap'){
    $('tap').addEventListener('pointerdown',()=>{
        S.r += getTapValue(); save(); head();
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });
 }
}

function buyUpgrade(type){
    if(type === 'tap'){
        const cost = getTapCost();
        if(S.r >= cost) { S.r -= cost; S.tapLvl++; save(); head(); view(); }
        else alert('Мало кэша!');
    } else if(type === 'auto'){
        const cost = getAutoCost();
        if(S.r >= cost) { S.r -= cost; S.autoLvl++; save(); head(); view(); }
        else alert('Мало кэша!');
    }
}

function buy(id){
    const item = ITEMS.find(x=>x.id===id);
    if(S.r >= item.p){
        S.r -= item.p; S.own[id] = 1; save(); head(); 
        // Не перерисовываем весь экран, чтобы поиск не сбрасывался
        const displayItems = getFilteredItems();
        const container = document.getElementById('shop-items');
        if (container) container.innerHTML = renderShopItems(displayItems);
        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else alert('Мало кэша!');
}

let currentSlot = null;
function openSelect(slot) {
    currentSlot = slot;
    const types = SLOTS[slot];
    const available = ITEMS.filter(i => S.own[i.id] && types.includes(i.t));
    
    $('modal-title').textContent = SLOT_NAMES[slot];
    const list = $('modal-list');
    
    if(available.length === 0) {
        list.innerHTML = '<p style="text-align:center;color:var(--mut);grid-column:1/-1;">Нет вещей для этого слота</p>';
    } else {
        list.innerHTML = available.map(i => `<div class="cell own" onclick="equipItem('${i.id}')">${artSpan(i)}<div style="margin-top:5px;line-height:1.1">${i.n}</div></div>`).join('');
    }
    $('select-modal').classList.add('open');
}

function equipItem(id) {
    if(currentSlot) {
        S.eq[currentSlot] = id;
        save(); head(); view(); closeModal();
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }
}

function closeModal() {
    $('select-modal').classList.remove('open');
    currentSlot = null;
}

$('nav').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    tab=b.dataset.t;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
    view();
});

setInterval(() => {
    if (S.autoLvl > 0) {
        S.r += getAutoValue();
        head();
    }
}, 1000);
setInterval(save, 5000);

head(); view();
</script>
</body>
</html>
